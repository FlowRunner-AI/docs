    - 'Terminology': definitions.md
    - 'Quick Start': learn/quickstart.md
    - 'Core Concepts':
      - 'Flows & Instances': learn/concepts/flows-and-instances.md
      - 'Triggers': learn/concepts/triggers.md
      - 'Blocks': learn/concepts/blocks.md
      - 'Variables & Data Buckets': learn/concepts/variables.md
      - 'Expressions': learn/concepts/expressions.md
      - 'Subflows': learn/concepts/subflows.md
      - 'Shared Memory': learn/concepts/shared-memory.md
    - 'Tutorials': learn/tutorials.md
  - 'Build':
    - 'The Flow Editor': build/flow-editor.md
    - 'Data & Variables': build/data-and-variables.md
    - 'Flow Control': build/flow-control.md
    - 'AI in Flows': build/ai-in-flows.md
    - 'Integrations & I/O': build/integrations.md
    - 'Managing Flows': build/managing-flows.md
  - 'Run & Monitor':
    - 'Testing': run/testing.md
    - 'Running Flows': run/running-flows.md
    - 'Scheduling': run/scheduling.md
    - 'Monitoring & Analytics': run/monitoring.md
  - 'Platform':
    - 'Forms': platform/forms.md
    - 'Knowledge Bases': platform/knowledge-bases.md
    - 'MCP Servers': platform/mcp-servers.md
    - 'Connections': platform/connections.md
    - 'Compliance & Security': platform/compliance-and-security.md
    - 'Workspace': platform/workspace.md
  - 'Block Reference':
    # BEGIN generated reference nav
    # END generated reference nav
  - 'Extend':
    - 'About Custom Actions': extend/custom-actions.md

docs_dir: content
site_dir: ../docs

copyright: 'Copyright &copy; 2026 Midnight Coders, Inc.'

extra_css:
  - 'css/style.css'
  - 'css/chat-widget.css'
  - 'css/flowrunner-mkdocs.css'
  - 'css/site-overrides.css'
#  - 'css/newstyle.css'
#  - 'css/bootstrap.min.css'
#  - 'css/bootstrap-theme.min.css'
#  - 'css/tabs.css'
#  - 'css/docs.css'
#  - 'css/bootstrap-tour-standalone.min.css'
#  - 'css/materialoverride.css'

extra_javascript:
  - 'js/chat-widget.js'
#  - 'js/jquery-3.3.1.min.js'
#  - 'js/bootstrap-tour-standalone.min.js'
#  - 'js/docs.js'

theme:
  name: 'material'
  custom_dir: overrides
  # logo: 'flowrunner-logo.png'   # superseded by icon.logo (inline SVG, recolored per theme in site-overrides.css)
  font:
    text: Inter Tight
    code: JetBrains Mono  

  features:
    - announce.dismiss
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer
    - content.tabs.link
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - navigation.indexes    

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    annotation: material/help-network-outline
    logo: flowrunner/logomark

use_directory_urls: false

extra:
  generator: false

#watch:
#  - includes

markdown_extensions:
  - admonition
#  - codehilite:
#      linenums: False
#      guess_lang: False
  - toc:
      permalink: True
#  - markdown_fenced_code_tabs:
#      single_block_as_tab: False
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      base_path:
        - ./snippets/  
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg    
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format      
  - attr_list    
  - md_in_html
  - abbr
  - footnotes


plugins:
  - search
  - social:
      cards_layout_options:
        # FlowRunner forest green — reads well on white messaging app backgrounds
        background_color: "#1F4438"
        color: "#FAF7F0"
  - glightbox:
      skip_classes:
        - skip-lightbox

