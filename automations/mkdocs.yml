# Render ((UI Component)) markers as .fr-control chips on hand-authored pages
# (the generated Block Reference already has its chips baked in - no-op there).
hooks:
  - hooks/strip_html_comments.py
  - hooks/control_chips.py

theme:
  name: 'material'
  custom_dir: overrides
  # logo: 'flowrunner-logo.png'   # superseded by icon.logo (inline SVG, recolored per theme in site-overrides.css)
  font:
    text: Inter Tight
    code: JetBrains Mono  

  features:
    - announce.dismiss
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer
    - content.tabs.link
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - navigation.indexes    

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    annotation: material/help-network-outline
    logo: flowrunner/logomark

use_directory_urls: false

extra:
  generator: false

#watch:
#  - includes

markdown_extensions:
  - admonition
#  - codehilite:
#      linenums: False
#      guess_lang: False
  - toc:
      permalink: True
#  - markdown_fenced_code_tabs:
#      single_block_as_tab: False
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      base_path:
        - ./snippets/  
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg    
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format      
  - attr_list    
  - md_in_html
  - abbr
  - footnotes
  - material.extensions.preview:
      configurations:
        - targets:
            include:
              - index.md
              - build/*
              - manage/*
              - run/*
              - reference/*
              - learn/*
              - platform/*

plugins:
  - search
  - social:
      cards: !ENV [CARDS, true]   # defaults true (CI/prod build has cairo); on local arm64 without cairo run with CARDS=false
      cards_layout_options:
        background_color: "#FAF7F0"
        color: "#1F4438"
        font_family: Inter Tight
        logo: content/assets/social/logomark-green.svg
  - glightbox:
      skip_classes:
        - skip-lightbox

