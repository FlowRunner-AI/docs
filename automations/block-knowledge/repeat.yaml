id: repeat
name: Repeat
category: Utils
kind: native

api:
  group_type: LOOP
  loop_type: REPEAT
  config_keys: [condition, maxIterations, firstElementId, storeResult, onFailElemId, enabled]
  inner_blocks: "elements whose element.groupId == this group's id"

testability:
  class: deterministic
  hermetic: true
  mock_strategy: "Drive with a deterministic counter/condition (Set Variables) in the body."

docs:
  purpose: >
    Repeat an inner sub-flow while a condition holds (with a failsafe iteration cap).
  when_to_use: >
    Loop an unknown number of times until a condition becomes false (polling, retries,
    accumulation) — when you don't have a fixed list (use List Iterator for lists).
  mental_model: >
    A while-loop container. Runs the body, re-checks the condition; stops when false or
    when maxIterations (failsafe) is hit.
  config:
    - field: Condition
      type: condition
      required: true
      description: Loop continues while true (re-evaluated each iteration).
    - field: Max Iterations (failsafe)
      type: number
      default: 10000
      description: Hard cap to prevent infinite loops.
  produces_result: true
  data_in: The condition (+ whatever the body reads/writes).
  data_out: Aggregated loop result.
  gotchas:
    - "Current Iteration Number starts at 0."
    - "Always set a sane failsafe (default 10000) during development."
    - "Requires inner blocks (double-click to edit the loop body)."
    - "Stored as a groups[] entry (loopType REPEAT). Contrast List Iterator (uses `list`)."
  cross_refs: [list-iterator, condition, set-variables]
  terminology: [Repeat, Current Iteration Number, Failsafe Protection Count]

help_tooltips:   # verbatim from product UI (i.fa-circle-question on hover)
  Maximum Iteration Count: "Set the maximum iteration limit to interrupt the Repeat While loop. Useful for preventing endless loops if the logic does not exit as expected."
  Current Iteration: "TODO: Create a help text here"   # UNWRITTEN placeholder in product (flag to product team)

behavior:
  - "Evaluates condition each iteration; runs body while true (product calls it a 'Repeat While' loop)."
  - "Stops at first false condition OR at maxIterations (failsafe)."

assertions:
  - id: loops-until-false
    when: run-instance
    given: "body increments a counter; condition counter < 3"
    expect: "body executed exactly 3 times"
  - id: failsafe-caps
    when: run-instance
    given: "always-true condition, maxIterations 5"
    expect: "body executed 5 times then stopped"

known_bugs: []

training:
  learning_objectives:
    - "Loop until a condition is false; set a failsafe."
    - "Choose Repeat (condition) vs List Iterator (list)."
  prerequisites: [list-iterator, condition, set-variables]
  common_mistakes:
    - "Forgetting the failsafe (risking long runs)."
    - "Body that never makes the condition false."
  exercise: >
    Poll a status with a Repeat: condition status != 'done', body re-fetches status,
    failsafe 20.

provenance:
  confidence: V-config
  evidence: "Schema from scratch flow (LOOP/loopType REPEAT: condition + maxIterations=10000 + firstElementId). No real-flow usage in MyProjects/FBB. notes.md."
  verified_on: 2026-06-14
