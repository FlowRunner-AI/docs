id: http-request
name: HTTP Request
category: Actions
kind: native

api:
  element_type: ACTION
  meta_type: HTTP
  config_keys: [url, method, body, query, headers, storeResult, onFailElemId, logging, skipBlock]

testability:
  class: external          # hits a real endpoint
  hermetic: false
  mock_strategy: "Point at a deterministic test endpoint, or stub via Skip Block + Simulated Result."

docs:
  purpose: >
    This block calls a web service over HTTP and hands the response back to your flow.
    You set the address and the method, fill in any data the service needs, and the block's
    result is whatever the service sends back.
  mental_model: >
    Each time the flow reaches this block, it sends one request to the address in the URL
    field and waits for the reply. The Method tells the service what you want to do - GET
    reads, POST creates, PUT and PATCH update, DELETE removes, HEAD checks. You attach the
    pieces a request can carry: a Body (the data you are sending, usually JSON), a Query (the
    extra parameters tacked onto the end of the URL, like a search term or a page number),
    and Headers (named values that travel alongside the request, most often the ones that
    prove who you are). When the reply comes back, the block's result is the response body -
    the data the service returned - ready for the next step to read.
  when_to_use: >
    Reach for it whenever your flow needs to talk to a service that FlowRunner does not
    already have a dedicated block for: pulling records from a third-party API, posting an
    update to a webhook, kicking off a job in another system. If a purpose-built block exists
    for the service you are calling, that block is usually less work because it handles the
    address and the authentication for you. This block is the general-purpose option for
    everything else - any service with a web API is reachable from here.
  example:
    - text: >
        Suppose you want to list the public organizations a GitHub user belongs to. GitHub's
        API answers that at a fixed address, so set the Method to GET and the URL to the
        endpoint for that user:
    - lang: text
      code: |
        https://api.github.com/users/octocat/orgs
    - text: >
        GitHub asks callers to identify the kind of response they want, so add one Header -
        a Name of Accept and a Value of application/vnd.github+json. A GET request like this
        carries no Body, since you are reading rather than sending. With that filled in, run
        the block on its own with Run Block in Test Mode - this sends the real request once,
        so you can see exactly what comes back before you wire anything downstream. The
        response body is a list of organizations, each one an object:
    - lang: json
      code: |
        [
          { "login": "github",     "id": 9919,   "url": "https://api.github.com/orgs/github" },
          { "login": "octo-org",   "id": 583231, "url": "https://api.github.com/orgs/octo-org" }
        ]
    - text: >
        That captured shape is what makes the result easy to use next. A following block can
        now reach into it - for example, the first organization's login is the result's first
        item's login property - and the Expression Editor offers those names for you because
        the Test run showed it the real structure. The payoff: one block turned a public API
        into structured data your flow can act on.
    - image: ../images/reference/http-request-config.png
      alt: >
        The HTTP Request block configured: the URL points at a GitHub API endpoint, with HTTP Method, Body, Query, and Headers below it.
  common: [name, result_alias, assign_variable, skip_block, logging, notes]
  config:
    - field: URL
      type: expression
      description: >
        Required. The full web address to send the request to. It can be a fixed address or
        an expression that builds the address from earlier values.
    - field: HTTP Method
      type: dropdown
      description: >
        What you want to do at that address: GET reads, POST creates, PUT and PATCH update,
        DELETE removes, HEAD checks. Defaults to GET.
    - field: Body
      type: expression
      description: >
        The data you are sending with the request, usually JSON. Used by methods that
        write, such as POST, PUT, and PATCH; a GET typically has none.
    - field: Query
      type: expression
      description: >
        Extra parameters appended to the URL, such as a search term, a page number, or a
        filter the service understands.
    - field: Headers
      type: repeatable Name/Value
      description: >
        Named values sent alongside the request, each a Name and a Value. Most often used for
        authentication (an API key, a Bearer token, or Basic credentials) and to declare the
        content type.
  produces_result: true
  data_in: The URL, method, headers, body, and query you configure.
  data_out: The response body the service returns.
  gotchas:
    - "The result is only the response body - the data the service sent back. The status code and the response headers are not handed to you separately, so if you need to know whether a call succeeded, check for a value the body itself contains."
    - "Before you reference the result in later blocks, run this block once with Run Block in Test Mode. That sends the real request and captures the actual shape of the response, so the Expression Editor can offer you the right field names. Until then, downstream blocks only have a placeholder to work from."
    - "Authentication usually travels in a Header. If a call comes back rejected, the first thing to check is whether the right auth header (an API key, a Bearer token, or Basic credentials) is present and correct."
  cross_refs: [custom-cloud-code, handle-error, expression-editor]
  terminology: [HTTP Request, Headers, Method]

assertions:
  - id: get-returns-body
    when: run-block
    given: "GET a known JSON endpoint"
    expect: { status: Success, result_shape: "matches the endpoint's JSON" }

known_bugs: []

training:
  learning_objectives:
    - "Call an API with method/headers/body and consume the response."
    - "Authenticate via headers."
    - "Capture the response shape with a Test run."
  prerequisites: [expression-editor]
  common_mistakes:
    - "Expecting status codes/headers in the result (body only)."
    - "Forgetting auth headers."
  exercise: >
    GET a public JSON API, run it in Test Mode, then reference a nested field downstream.

provenance:
  confidence: V-run
  evidence: "MyProjects 'This is my new flow' — HTTP Request (GET github orgs) run in Test Mode; result inspected. FBB 'Application Processor' 'Create Application'. notes.md + screenshots 06,16."
  verified_on: 2026-06-13
