id: actions-group
name: Actions Group
category: Groups
kind: native

api:
  group_type: ACTIONS
  config_keys: [transitionMode, storeResult, onFailElemId]
  inner_blocks: "elements whose element.groupId == this group's id"

testability:
  class: deterministic
  hermetic: true
  mock_strategy: "Use deterministic inner actions (Cloud Code/Transform Data)."

docs:
  purpose: >
    This group holds several actions and starts them all at the same time, so independent
    work runs side by side instead of one step after another.
  mental_model: >
    It is a block container that runs its inner actions in parallel. You drop two or more
    actions inside it, and when the flow reaches the group every one of them starts together
    rather than waiting its turn. Because they overlap, the group takes about as long as its
    slowest action rather than the sum of all of them. You decide when the rest of the flow is
    allowed to move on by setting the group's Outgoing Transition Mode: **On Start** releases the
    downstream path the moment the actions have all been kicked off, without waiting for any of
    them to finish, while **On Completion** holds the path until every inner action has finished.
  when_to_use: >
    Reach for it when you have two or more actions that do not depend on each other and you want
    them to run at the same time instead of waiting one after another - calling three separate
    services to enrich a record, or kicking off several independent setup steps at once. The
    payoff is wall-clock time: three calls that each take a second finish in about a second
    together rather than three seconds in sequence. Choose On Completion when a later step needs
    the work actually done before it runs; choose On Start when you only want to launch the
    actions and let them finish on their own while the flow carries on. If you need each action's
    result available downstream, On Completion is the safe choice - On Start can move ahead before
    any of them have produced anything.
  example:
    - text: >
        Suppose a flow has just created a new customer record, and three pieces of enrichment can
        all happen independently: look up the company from a data provider, fetch the credit score,
        and pull recent support tickets. None of them needs the others, so running them one after
        another would waste time. Drop all three actions - each an HTTP Request to a different
        service - inside an Actions Group.
    - text: >
        The next step builds a single enriched profile that needs all three results, so the flow
        must not move on until every call is done. Set the group's Outgoing Transition Mode to
        On Completion:
    - lang: text
      code: |
        Inside the Actions Group (all start together):
          Action A: HTTP Request "Company Lookup"     finishes at ~0.6s
          Action B: HTTP Request "Credit Score"       finishes at ~1.1s
          Action C: HTTP Request "Support Tickets"    finishes at ~0.4s
    - text: >
        All three calls leave at once. Action C comes back first at about 0.4 seconds, Action A at
        about 0.6, and Action B last at about 1.1. Under On Completion the group holds the
        downstream path until Action B - the slowest - lands, so the whole group takes about 1.1
        seconds rather than the roughly 2.1 seconds the three calls would add up to in sequence.
        Only then does the flow continue to the step that reads all three results and builds the
        profile.
    - text: >
        Had you chosen On Start instead, the flow would have moved on the instant the three calls
        were launched, long before any of them returned - fine if you only wanted to fire the calls
        off, but wrong here, because the profile step would find no results waiting for it.
  config:
    - field: Outgoing Transition Mode
      type: dropdown
      description: >
        When the rest of the flow is allowed to continue. On Start releases the downstream path as
        soon as every inner action has been started, without waiting for results. On Completion
        holds it until every inner action has finished.
  produces_result: true
  data_in: The inner actions the group holds.
  data_out: Continues per the transition mode; each inner action's own result is available downstream.
  gotchas:
    - "The inner actions run side by side, not one after another, so you cannot count on one finishing before another starts. If an action needs another's result, those two cannot share a single Actions Group."
    - "Under On Start the flow moves on the moment the actions have been launched, before they have produced anything. If a later step needs their results, use On Completion instead so the group waits for them to finish."
    - "The group itself does not hand back a combined result. To use what the actions produced, read each inner action's own result downstream."
  cross_refs: [triggers-group, synchronize]
  terminology: [Actions Group, Outgoing Transition Mode]

assertions:
  - id: parallel-on-completion
    when: run-instance
    given: "two inner actions (each ~1s) under ON_COMPLETION"
    expect: "both ran; downstream started after both finished (~1s, not ~2s)"

known_bugs: []

training:
  learning_objectives:
    - "Run actions in parallel with a group; pick a transition mode."
    - "Pair with Synchronize when converging separate branches."
  prerequisites: [synchronize]
  common_mistakes:
    - "Relying on inner results under ON_START."
    - "Expecting a group-level result."
  exercise: >
    Put three independent enrichment calls in an Actions Group (ON_COMPLETION), then use
    their results downstream.

provenance:
  confidence: V-real
  evidence: "MyProjects 'Content Engine' v6 — ACTIONS group 'Load Context Files', transitionMode ON_COMPLETION. notes.md."
  verified_on: 2026-06-14
