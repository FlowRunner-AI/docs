  evidence: "Block VERIFIED live in palette 2026-06-24 (native 'Speech to Text'; internal element id is ai-create-transcription - the docs record keeps the readable id ai-speech-to-text). Config fields confirmed in-product: Model, File URL, Language, Prompt, Temperature (no per-block AI API Key field - uses the workspace AI config); default result alias 'Speech to Text Result'. Result text-property shape from legacy; not runtime-re-run this pass. Block+config screenshot still to capture."
  verified_on: 2026-06-24
