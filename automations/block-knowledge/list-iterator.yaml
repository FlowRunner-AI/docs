id: list-iterator
name: List Iterator
category: Utils
kind: native

api:
  group_type: LOOP
  loop_type: LIST_ITERATOR
  config_keys: [list, firstElementId, storeResult, onFailElemId, enabled]
  inner_blocks: "elements whose element.groupId == this group's id"

testability:
  class: deterministic   # the iterator itself; inner blocks may be external
  hermetic: true
  mock_strategy: "If inner blocks call external services, stub them via Skip Block + Simulated Result."

docs:
  purpose: >
    This block runs the same set of steps once for each item in a list. You give it an array,
    build the per-item steps inside it, and it runs them for every item.
  mental_model: >
    It is a block container, dropped from the Utils category of the block palette: the steps you
    build inside it run once for each item in the list, and on each pass the current item is made
    available to those steps as {{Current Iteration Item}} - the whole item. The loop also exposes
    the pass number as {{Current Iteration Number}}, counting up from 0, so a step can tell which
    pass it is on.
  when_to_use: >
    Reach for it whenever you have a list and need to do the same work for every entry: send a
    message to each recipient, validate each row, enrich each record. For a small, fixed set of
    items a few separate blocks might be simpler, but as soon as the count is dynamic, or you
    would be copying the same blocks again and again, one List Iterator is far cleaner.
  example:
    - text: >
        Suppose an earlier block, an HTTP Request, returned this list of orders:
    - lang: json
      code: |
        [
          { "id": 1024, "customer": "Acme",    "status": "open" },
          { "id": 1025, "customer": "Globex",  "status": "cancelled" },
          { "id": 1026, "customer": "Initech", "status": "open" }
        ]
    - text: >
        Say you want to collect the id of every order you process, stopping as soon as you reach a
        cancelled one. Each entry is an order with an `id`, a `customer`, and a `status`. Point the
        loop's ((List)) at that result and the steps inside run once for each order, with that order
        handed to them as {{Current Iteration Item}} - the whole order. To read the current order's
        status, you build the expression {{Current Iteration Item->status}} in the Expression
        Editor, picking {{Current Iteration Item}} under Flow Context and reaching its `status` property:
    - image: ../images/reference/list-iterator-expression.png
      alt: >
        The Expression Editor with Current Iteration Item under Flow Context, used to build the
        expression Current Iteration Item arrow status.
    - text: >
        So for the Acme order {{Current Iteration Item->status}} reads `"open"`, and for the
        Globex order, `"cancelled"` - the value the loop will check to decide whether to keep going.
    - text: >
        Now the work. A loop cannot hand a value back to the rest of the flow on its own, so you
        collect what you build up in a variable that lives outside it - a [Data Bucket](../learn/concepts/variables.md) variable.
        Before the List Iterator, a Set Variables block declares that variable, here `List with IDs`,
        and sets it to `Empty List`, a built-in value that gives you a fresh list with nothing in it yet:
    - image: ../images/reference/list-iterator-seed.png
      alt: >
        A Set Variables block before the loop, assigning the Empty List value to a Data Bucket
        variable named List with IDs.
    - text: >
        Inside the loop, a Condition named Order cancelled? checks {{Current Iteration Item->status}}
        against `"cancelled"`: its ((Value to Check)) is the {{Current Iteration Item->status}} expression,
        its ((Operation)) is ((EQUALS)), and its ((Value)) is `cancelled`:
    - image: ../images/reference/list-iterator-condition.png
      alt: >
        The Condition's configuration: Value to Check is Current Iteration Item arrow status,
        Operation is EQUALS, and Value is cancelled.
    - text: >
        A Condition splits the flow in two: its ((Yes)) branch runs when the check is true, its
        ((No)) branch when it is false. The check here is `status` equals `"cancelled"`, so the
        everyday per-order work sits on the No branch (the order is not cancelled) and the early
        exit on the Yes branch (it is). While an order is not cancelled, the Condition's No branch
        runs a Transform Data block named Add To List Operation. A Transform Data block lets you pick
        an operation; here you choose ((Add To List)), which appends the order's `id` to
        `List with IDs` and writes the result back to that same variable, so the list grows by one
        entry each pass:
    - image: ../images/reference/list-iterator-transform.png
      alt: >
        The Transform Data block named Add To List Operation, with the Add To List operation, adding
        Current Iteration Item arrow id to the List with IDs variable and assigning the result back to it.
    - text: >
        The moment an order is cancelled, the Condition's Yes branch runs a Break that ends the loop.
        Put together, the loop looks like this:
    - image: ../images/reference/list-iterator-loop.png
      alt: >
        Inside the List Iterator: Start leads to the Condition Order cancelled? Its No branch leads
        to the Transform Data block Add To List Operation; its Yes branch leads to a Break that ends the loop.
    - text: |
        Here is what happens, order by order:

        - **The Acme order** (`1024`, `open`): not cancelled, so the No branch adds its id - `List with IDs` becomes `[1024]`.
        - **The Globex order** (`1025`, `cancelled`): the Yes branch fires the Break and the loop stops; its id is never added.
        - **The Initech order** (`1026`) is never reached.

        After the loop, `List with IDs` holds `[1024]` - the orders you got through before the cancelled one. A block after the loop reads it back through the Expression Editor as {{Data Buckets:List with IDs->}}.
  config:
    - field: List
      required: true
      description: The array to loop over, usually an expression pointing at a previous block's result.
  common: [name, skip_block, notes]
  produces_result: true
  data_in: The `list` array; per item, "Current Iteration Item" inside the loop body.
  data_out: Aggregated loop result (storeResult).
  gotchas:
    - "If you set ((List)) to an array you typed by hand, turn on the Expression Editor's ((As JSON)) toggle so it is read as structured data. Without it, FlowRunner sees the whole thing as one piece of text rather than a list of separate items, so there is nothing for the loop to step through. A list that comes from a previous block's result is already structured."
    - "If the list is empty, the inner steps do not run at all."
    - "To edit the steps inside the loop, step into it: hover the loop and choose ((Expand)), then use ((Return)) at the top-left to come back out."
    - "A block's result inside the loop lives only for the current pass - each pass overwrites it, and a later pass cannot read an earlier pass's block result. Nothing an inner block produces is available after the loop, either. To carry a value from one pass to the next, or out of the loop, accumulate it into a Data Bucket variable declared outside the loop, then read that variable after the loop finishes (the Example walks through this with List with IDs)."
  cross_refs: [break, repeat, transform-data, current-iteration-item, instances-concept, set-variables]
  terminology: [List Iterator, Current Iteration Item, Current Iteration Number, Iteration]

behavior:
  - "The inner steps run once per item, and each pass exposes that item as {{Current Iteration Item}} and the pass number as {{Current Iteration Number}} (counting from 0)."
  - "A block's result inside the loop is scoped to the current pass - it is not available to a later pass or after the loop; carry values across passes or out of the loop through a Data Bucket variable."
  - "A Break block inside the loop ends it immediately, leaving any remaining items unprocessed."
  - "You can inspect any single pass afterwards in the flow's analytics - the view of a past run - stepping through each pass block by block."

assertions:
  - id: iterates-per-item
    when: run-instance
    given: "list of length N feeding the iterator"
    expect: "each inner block executed exactly N times; per-iteration inputs differ"
  - id: empty-list-skips
    when: run-instance
    given: "list = []"
    expect: "inner blocks executed 0 times"
  - id: exposes-current-item
    when: run-instance
    given: "inner block references Current Iteration Item"
    expect: "iteration k input == list[k]"

known_bugs: []

training:
  learning_objectives:
    - "Iterate an array and reference the current item via Current Iteration Item."
    - "Step into a loop and inspect a single iteration in analytics."
  prerequisites: [set-variables, expression-editor, instances-concept]
  common_mistakes:
    - "Trying to 'return' from inside the loop."
    - "Forgetting an empty list skips the body."
  exercise: >
    Iterate a 3-row list; inside, build a string from Current Iteration Item and append it
    to a Data-Bucket variable. Open an instance and step iterations 1->3 to confirm each
    item was processed.

provenance:
  confidence: V-run
  evidence: "MyProjects 'Recover180 Audit' v3 instance 2ECB07CF (24 iterations; iter 1 vendorRef Ref103125-1 vs iter 12 144557); 'Content Engine' v6 (7 LIST_ITERATOR groups). Screenshots 49-51."
  verified_on: 2026-06-14
