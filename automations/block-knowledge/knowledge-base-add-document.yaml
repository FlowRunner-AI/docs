id: knowledge-base-add-document
name: "Knowledge Base: Add Document"
category: Actions
kind: native

api:
  element_type: ACTION
  meta_type: KNOWLEDGE_BASE
  subtype: ADD_DOCUMENT
  config_keys: [knowledgeBaseId, content, fileName, metadata, retryPolicy, saveToVariable, storeResult, onFailElemId, logging]

testability:
  class: external          # writes to a real vector store + calls embeddings
  hermetic: false
  mock_strategy: "Use a dedicated test KB, or stub via Skip Block + Simulated Result. Processing is async (Processing -> Completed)."

docs:
  purpose: >
    This block lets a flow feed content into a Knowledge Base on its own, so an AI Agent can later
    answer from it - the body of a fetched page, a support ticket, a generated summary - without
    anyone uploading a file by hand. You can tag each document with labels as you add it, which is
    what makes it findable and removable in bulk afterward.
  mental_model: |
    You will find this block in the Actions group of the block palette. A Knowledge Base stores
    text in a form that later steps can search by meaning rather than by exact wording. When you
    hand this block some content, the Knowledge Base does not keep it as one long string: it breaks
    the text into smaller passages and converts each one into the numeric form a meaning-based
    search needs, then files those away. How it splits and converts the text is decided once on the
    Knowledge Base itself, not on this block - so the same Add Document block behaves consistently
    no matter where in the flow you place it.

    Alongside the text you can attach ((Metadata)): a small set of labels, like a source name or a
    category, that travel with the document and that you can match against later when you list or
    remove documents.

    The block does not block the flow on indexing. It hands back a result the moment the document
    is accepted, and that result carries the document's processing status - which starts as
    `Processing` and turns to `Completed` once the Knowledge Base finishes splitting and converting
    the text in the background. Give the block a result alias in ((Reference Result Data As)), and a
    later block can read the status as {{Add Document Result->status}}, building the
    reference in the Expression Editor under Block Data so it binds.
  when_to_use: >
    Reach for it when a flow needs to put content into a Knowledge Base on its own, without anyone
    uploading a file by hand. A typical case is feeding in text another block produced - the
    body of a fetched web page, a support ticket, a generated summary - so it becomes searchable
    for later steps or for an AI Agent that answers from that Knowledge Base. It is the in-flow
    equivalent of dropping a file onto the Knowledge Base by hand, which means you can keep the
    store current automatically as new content arrives, instead of maintaining it yourself.
  sections:
    - title: Tag with metadata so you can find it later
      body: |
        Once a document is inside a Knowledge Base, the agent searches it by meaning - but a flow
        that wants to point back at a specific document needs a handle on it, and that handle is
        metadata. Metadata is a small set of labels you attach as you add the document: key/value
        pairs like a source name or a category that travel with it from then on.

        Those labels are exactly what the matching Knowledge Base steps work from. A later
        Knowledge Base: List Documents step can return every document whose source is your support
        site, and a Knowledge Base: Delete by Filter step can remove every document whose category
        is account in one pass. The filter matches on the labels you set here - so the choice you
        make at add time is what makes a document findable and removable in bulk afterward.

        The catch is that this is your only handle. If you add a document with no metadata, there
        is nothing for a later List or Delete by Filter step to match on, and you will not be able
        to single that document out again. So tag as you add, even when you do not yet know which
        labels you will filter on - a source and a category cost nothing now and are the difference
        between cleaning up a batch later and being unable to.

        Labels stay flat: a value can be text or a number, but not another object nested inside it.
  example:
    - text: >
        Suppose an earlier HTTP Request block fetched a help article from your support site and
        returned it like this:
    - lang: json
      code: |
        {
          "title": "Resetting your password",
          "body": "To reset your password, open Settings, choose Security, and click Reset...",
          "category": "account"
        }
    - text: >
        You want this article searchable so an AI Agent can answer password questions from it later.
        Set the block's ((Knowledge Base ID)) to your support Knowledge Base, point
        ((Content)) at the article body from the fetch result, and give it a ((File Name)) so it is
        recognizable in the Knowledge Base's document list:
    - lang: text
      code: |
        Knowledge Base : Support Articles
        Content        : {{HTTP Request Result->body}}
        File Name       : Resetting your password
    - text: >
        Now attach ((Metadata)) so you can find or clean up this article later. Add two labels - a
        source and a category - using the ((Metadata)) key/value rows:
    - lang: text
      code: |
        source   : support-site
        category : account
    - image: ../images/reference/knowledge-base-add-document-config.png
      alt: >
        The Knowledge Base: Add Document block selected on the canvas with its configuration panel:
        Knowledge Base ID is Support Articles, Content is bound to the HTTP Request result body, File
        Name is Resetting your password, and two Metadata rows read source = support-site and
        category = account.
    - text: >
        When the flow runs, the block hands the article body to the Support Articles Knowledge Base.
        The Knowledge Base splits it into passages, converts each into searchable form, and stores
        them with your two labels attached. The Knowledge Base does this work in the background, so
        the document shows as processing for a moment before it is finished and ready to be searched.
    - text: >
        Give the block a result alias - say {{Add Document Result}} in ((Reference Result Data As)) -
        and a following block can read the indexing status straight off it. Build the reference in
        the Expression Editor under Block Data so it binds, and a Condition can hold the flow until
        the document is ready by checking {{Add Document Result->status}} equals `Completed`.
        From then on, a later Knowledge Base: List Documents step filtered to category equals account
        will return this article, and an AI Agent pointed at this Knowledge Base can draw on it when
        it answers.
  common: [name, result_alias, assign_variable, logging, notes]
  config:
    - field: Knowledge Base ID
      type: expression
      required: true
      description: The Knowledge Base to add the document to, set by its name or an expression.
    - field: Content
      type: expression (string)
      required: true
      description: The document text to add, usually an expression pointing at a previous block's result.
    - field: File Name
      type: expression (string)
      description: An optional name for the document, used to recognize it in the Knowledge Base's document list.
    - field: Metadata
      type: repeatable Property/Value
      description: >
        Optional labels attached to the document, as key/value pairs, that later List and Delete
        steps can match against. You can enter them as separate Property/Value rows, or switch to
        passing a single object instead. Only flat key/value pairs are allowed - a value cannot be
        a nested object.
  produces_result: true
  data_in: content (+ fileName + metadata) into a KB.
  data_out: Add result (document reference); also assignable to a variable.
  gotchas:
    - "Adding a document does not finish the instant the block does. The Knowledge Base processes the text in the background, so a document you added may not be searchable or appear in a list for a short while - it shows as processing until it is ready."
    - "Metadata is how you find a document again. The labels you attach here are exactly what a later Knowledge Base: List Documents or Delete by Filter step matches on, so if you skip metadata you will have no way to filter for this document later."
    - "Metadata labels have to be flat key/value pairs. A label's value can be text or a number, but not another object nested inside it."
  cross_refs: [knowledge-base-list-documents, knowledge-base-delete-by-filter, knowledge-bases-concept, ai-agent]
  terminology: [Knowledge Base, Document, Metadata, Chunk Size, Chunk Overlap, Embedding]

behavior:
  - "Returns a reference to the added document. Give the block a result alias in Reference Result Data As, then read the reference downstream as {{Add Document Result->status}} (built in the Expression Editor under Block Data), or store it in a Data Bucket variable via Assign to a Variable for a later step to use."
  - "Surfaces the document's processing status on that result, which starts as `Processing` and moves to `Completed` once the Knowledge Base finishes indexing it in the background."

assertions:
  - id: add-then-list-finds-it
    when: run-instance
    given: "Add content with metadata {tag: t1} to a test KB, then List filter {tag: t1}"
    expect: "the added document appears in the List result (after processing completes)"

known_bugs: []

training:
  learning_objectives:
    - "Ingest content into a Knowledge Base from a flow."
    - "Tag documents with metadata for later retrieval/cleanup."
    - "Understand chunking/embedding happens per the KB Setup."
  prerequisites: [knowledge-bases-concept, http-request, expression-editor]
  common_mistakes:
    - "Expecting immediate availability (processing is async)."
    - "Omitting metadata, then being unable to filter later."
  exercise: >
    Fetch a document via HTTP, Add it to a test KB with metadata {source: demo}, then
    List with that filter to confirm it landed.

provenance:
  confidence: V-real
  evidence: "Tests workspace 'KB Test' flow v1 — Add Document (knowledgeBaseId 'Test KB', content <- Fetch result, metadata metaPropDemo1/2). KB Setup + Data inspected. notes.md + screenshots 53-56."
  verified_on: 2026-06-15
