id: call-flow
name: Call Flow
category: Actions
kind: native

api:
  element_type: ACTION
  operation: CALL_FLOW
  meta_type: BACKENDLESS
  subtype: AUTOMATION_SERVICE
  config_keys: [flowId, initialData, initialDataParams, syncCall, storeResult, onFailElemId, logging]

testability:
  class: deterministic   # if the called flow is deterministic
  hermetic: true
  mock_strategy: "Call a hermetic test sub-flow, or stub via Skip Block + Simulated Result."

docs:
  purpose: >
    This block runs another one of your flows as a step inside this one. You pick the flow to
    run, hand it the values it needs to start, and you can either wait for it to finish and read
    back what it produced, or let it run on its own while this flow keeps going.
  mental_model: >
    Think of it as calling one flow from another, the way one task hands off part of its work to
    a second task. When the flow reaches this block, it starts a fresh run of the flow you chose -
    a separate Instance with its own data. The values you supply become that run's Initial Data,
    so the called flow reads them the same way it would read the payload from its own trigger.
    What happens next depends on **Wait for Execution**. With it on, this flow stops at the block
    until the called flow finishes, and the value the called flow sends back with its Return Result
    block becomes this block's result. With it off, this flow does not wait: it gets back only an
    `executionId` - an identifier for the run it kicked off - and continues immediately, while the
    called flow finishes on its own.
  when_to_use: >
    Reach for it when a piece of logic is worth keeping as its own flow and running from several
    places - creating a record, sending a notification, running a billing routine. Building that
    work once as a standalone flow and calling it keeps each flow shorter and means a fix lives in
    one place instead of being copied around. Turn **Wait for Execution** on when you need what the
    called flow produces before this flow can carry on, and off when you only need to set the work
    in motion and do not care to wait for it - for example launching a long job you will check on
    later. If the reusable steps only ever run inside this one flow, a SubFlow keeps them inline
    without a second flow to manage.
  example:
    - text: >
        Suppose you have a flow named Create Beneficiary that takes a few details, writes a
        beneficiary record, and finishes with a Return Result block that hands back the new
        record's id. You want to use it from a parent flow that is setting up an account, where an
        earlier block, Create IRA, has already produced the account it belongs to.
    - text: >
        Add a Call Flow block, choose Create Beneficiary as the flow to run, and turn on **Wait for
        Execution** so the parent flow waits and reads back the id. Then map the values the called
        flow needs to start. Each row is a name paired with an expression: the name has to match a
        value the called flow expects in its Initial Data, and the expression is where it comes from
        here. Bind a row named deposit_id to the account id the earlier block produced:
    - lang: text
      code: |
        Flow to run:        Create Beneficiary
        Wait for Execution: on

        Initial Data params:
          deposit_id   <-  {{Create IRA Result:id->}}
          first_name   <-  {{Initial Data:beneficiary.firstName->}}
          last_name    <-  {{Initial Data:beneficiary.lastName->}}
    - text: >
        When the parent flow reaches this block, it starts a run of Create Beneficiary with those
        three values as its Initial Data, then pauses. Create Beneficiary writes its record and its
        Return Result block sends back the new id, say `{ "id": 88412 }`. That object becomes this
        block's result, so the next block in the parent flow can read the id and go on to link the
        beneficiary to the account. Had you turned **Wait for Execution** off instead, the block
        would hand back an `executionId` right away and the parent flow would continue without
        waiting for the beneficiary record to be written.
  config:
    - field: Flow to run
      type: dropdown
      description: >
        Required. The flow this block runs. Only flows that are LIVE - published and ready to run -
        appear in the list and can be called.
    - field: Initial Data params
      type: repeatable name and expression
      description: >
        The values handed to the called flow to start its run. Each row pairs a name, which has to
        match a value the called flow expects in its Initial Data, with an expression that supplies
        it from this flow.
    - field: Wait for Execution
      type: toggle
      description: >
        When on, this flow waits for the called flow to finish and this block's result is the value
        from the called flow's Return Result block. When off, this flow does not wait and the block
        returns an executionId for the run it started.
  produces_result: true
  data_in: Initial Data params (each mapped from an expression).
  data_out: The called flow's Return Result when waiting, otherwise the executionId of the run it started.
  gotchas:
    - "You can only call a flow that is LIVE. A flow still in draft does not appear in the list, so publish it before you try to call it."
    - "What the block hands back depends on Wait for Execution. With it on, the result is the value from the called flow's Return Result block; with it off, the result is only an executionId - an identifier for the run, not the work it produced. If a later step expects the called flow's output, leave Wait for Execution on."
    - "If you are not waiting, the called flow runs on its own afterward, so this flow finishing does not mean the called flow has finished too."
  cross_refs: [subflow, return-result, synchronize, initial-data-concept]
  terminology: [Call Flow, Initial Data, Wait for Execution, executionId]

assertions:
  - id: sync-returns-callee-result
    when: run-instance
    given: "Call Flow (syncCall=true) to a flow that Return Results { ok:true }"
    expect: "this block's result == { ok:true } after callee completes"
  - id: params-passed
    when: run-instance
    given: "initialDataParams { x: 5 }"
    expect: "callee instance Initial Data.x == 5"

known_bugs: []

training:
  learning_objectives:
    - "Compose flows by calling one from another and passing params."
    - "Choose sync vs async and handle the different return."
    - "Distinguish Call Flow (other flow) from SubFlow (inline reuse)."
  prerequisites: [return-result, subflow, initial-data-concept]
  common_mistakes:
    - "Calling a non-LIVE flow."
    - "Assuming async returns the result (it returns executionId)."
  exercise: >
    Build a 'Create Record' flow that Return Results an id, then Call it from a parent
    flow (sync) and use the returned id downstream.

provenance:
  confidence: V-real
  evidence: "FBB 'Create IRA' (LIVE) — Call 'Create Beneficiary' Flow: operation CALL_FLOW, flowId, syncCall true, initialDataParams (deposit_id <- Create IRA Result.id, ...). notes.md."
  verified_on: 2026-06-14
