id: condition
name: Condition
category: Utils
kind: native

api:
  element_type: CONDITION
  config_keys: [parts, conditionLogic, storeResult, onFailElemId, logging]
  branches: "Two outputs: Yes (true) and No (false)."

testability:
  class: deterministic
  hermetic: true
  mock_strategy: null

docs:
  purpose: >
    This block lets you gate, guard, or fork a flow on a yes-or-no test. Ask a question about a value -
    is this order over 1000 dollars, is this record valid, is the box checked - and only the runs that
    match go down one path while everything else branches the other way.
  mental_model: |
    A Condition is a fork in the flow built around a single yes-or-no question. You frame the
    question - is this amount greater than 1000, is this status equal to cancelled, is this flag on -
    and when a run reaches the block, the question comes out either true or false. True sends that run
    down the block's Yes path; false sends it down the No path. The two paths leave the block
    separately, and you build different steps on each, so the flow handles a match one way and
    everything else another. That is the whole idea: one question, two ways out.

    The question does not have to be a single test. You can ask several things at once and weigh the
    answers together - is the amount over 1000 *or* is the order expedited, is the record valid *and*
    is the customer active. Each extra test joins the ones before it with AND or OR, and brackets let
    you group tests so you control which ones are weighed together before the rest. The run still comes
    out with one answer, true or false, and still leaves by Yes or No - the multi-part test
    lets a single fork stand in for a question too involved to phrase in one comparison.
  when_to_use: >
    Reach for it at any point where the flow should do one thing in one case and something else in
    another - a gate that lets work continue only when a record is valid, a guard that stops before
    a risky step, a fork that handles paid and unpaid orders differently. When you are choosing
    between exactly two outcomes from a single test, this is the most direct block for the job. If
    instead you are routing one value across many possible cases, a Value Router keeps that tidier
    than a stack of Conditions, and an AI Router decides the path from natural language rather than
    a fixed comparison.
  example:
    - text: >
        Suppose a flow processes an order, and an earlier step left the order details in Initial
        Data. You want orders over 1000 dollars to go through a manual approval step, while smaller
        orders are fulfilled right away. The order looks like this:
    - lang: json
      code: |
        {
          "id": 5821,
          "customer": "Globex",
          "amount": 1450,
          "expedited": true
        }
    - text: >
        Add a Condition - it lives in the Utils group of the block palette - and set its
        ((Value to Check)) to the order amount, read from Initial Data. Set ((Value Data Type))
        to INT, since the amount is a whole number, then pick the ((Operation)) GREATER THAN and
        set the value to compare against to 1000. That is the whole test: is the amount greater
        than 1000?
    - image: ../images/reference/condition-config.png
      alt: >
        The Condition block selected on the canvas with its configuration panel: Value to Check is
        the expression for Initial Data amount, Value Data Type is INT, Operation is GREATER THAN,
        and Value is 1000. The block's Yes and No outputs each lead on to a Set Variables block.
    - text: >
        For this order the amount is 1450, so the test is true and the flow takes the Yes path -
        where you place the manual approval step. An order with an amount of 600 would come out false
        and take the No path, where you place the steps that fulfill it straight away.
    - text: >
        Now suppose approval should also kick in for any expedited order, whatever its size. Instead
        of a second Condition, add a second part to this one with the ((+)) control: keep the amount
        check as the first part, add a part that checks the expedited flag ((Value Data Type))
        BOOLEAN / CHECKBOX, ((Operation)) IS TRUE, and join the two parts with OR. The Yes path now
        runs whenever the amount is over 1000 or the order is expedited, and only orders that are both
        small and not expedited fall through to the No path.
    - text: >
        A Condition routes the flow by its Yes and No paths, so most of the time the place each path
        leads to already tells you the answer and you never read the result by hand. The block still
        stores the outcome, though: it sets ((Reference Result Data As)) so the true-or-false result
        is available downstream under the alias {{Condition Result}}. That is useful when a later step
        needs to record or react to which way the fork went without sitting on a single branch - a
        block further down the flow reads it in the Expression Editor as {{Condition Result}}, which
        resolves to true or false.
  sections:
    - title: Asking AI instead of comparing
      position: after_example
      body: |
        Every ((Value Data Type)) offers one more operation after its comparisons: AI QUESTION.
        Instead of testing the value against something fixed, you ask a model a yes-or-no question
        about it. Pick AI QUESTION as the ((Operation)) and three settings appear:

        - **Yes/No Question** - the question, in plain language: "Is the customer asking for a
          refund?".
        - **AI Model** - the model that answers, picked from a provider-grouped list.
        - **AI API Key** - the key the call runs on; the field unlocks once a model is picked and
          offers your saved key setups.

        The model reads the value in ((Value to Check)) and answers the question about it. True
        takes the Yes path and false takes the No path, exactly like a comparison. In a multi-part
        condition the ((AI Model)) and ((AI API Key)) are set once for the whole block - every
        AI QUESTION part uses the same model and key.

        An AI QUESTION costs a model call on every run, and the same question can occasionally
        come back with a different answer. Keep it for judgments a fixed comparison cannot make,
        and let the comparisons handle everything exact.
      image: ../images/build/ai-question-refund-check.png
      alt: >
        A Refund Question block (Condition) after a test run on a refund request: the block and the
        Flag For Refund Team block on its Yes exit carry success checkmarks, Mark As Routine on the
        No exit is marked skipped. The configuration panel shows Value to Check bound to the Initial
        Data message, Value Data Type STRING, Operation AI QUESTION, the question "Is the customer
        asking for a refund?", a Claude model, and a saved key setup.
  config:
    - field: Value to Check
      type: expression
      description: >
        Required. The value the test runs against - usually an expression that reads from a previous
        block's result, Initial Data, or a Data Bucket variable.
    - field: Value Data Type
      type: dropdown
      description: >
        Required. The kind of value you are checking, such as STRING, INT, DOUBLE, BOOLEAN / CHECKBOX,
        DATETIME, JSON OBJECT, or JSON ARRAY. The available comparisons depend on this choice,
        so a number offers GREATER THAN while a checkbox offers IS TRUE.
    - field: Operation
      type: dropdown
      description: >
        Required. The comparison to run against the value, for example GREATER THAN, EQUALS, IS TRUE,
        or IS NOT EMPTY. Comparisons that take a second value - such as EQUALS - show a field where
        you supply the value to compare against.
    - field: Parts
      type: repeatable
      description: >
        Additional sub-tests added with the ((+)) control. Each part is its own value, type, and
        comparison. Parts are joined with AND or OR, and brackets group parts so you control which
        ones are weighed together.
  common: [name, result_alias, notes]
  produces_result: true
  data_in: The value to check and its comparison.
  data_out: A true or false result that routes the flow down the Yes or No path.
  gotchas:
    - "The Yes path runs when the test is true and the No path runs when it is false. Both paths leave the block; if you build steps on only one of them, the other case quietly leaves the flow with nothing to do."
    - "The comparisons offered depend on the ((Value Data Type)) you choose, so set the type to match the value. Checking a number as a STRING, for example, compares it character by character rather than by size, which can give a surprising answer."
    - "With several parts, the AND or OR connector between them can be switched, and the brackets decide which parts are grouped. With a mix of AND and OR, the grouping changes the outcome, so set the brackets deliberately rather than leaving the default."
    - "The block will not validate until at least one of its Yes or No connections is wired: until then it carries an error badge reading \"One of the ((Yes)) or ((No)) connection must be connected\", and ((Run Block)) stays disabled."
    - "A null value does not fail the block. When ((Value to Check)) resolves to null, the comparison comes out false and the run carries on down the No path, so a value that is sometimes missing needs no guard ahead of the block. Note that this makes IS EMPTY answer false for a null value as well - it reports on an empty value, not a missing one."
  cross_refs: [value-router, ai-router, expression-editor]
  terminology: [Condition, Value to Check, Value Data Type, Operation, Part]

assertions:
  - id: true-takes-yes
    when: run-instance
    given: "Value to Check resolves true"
    expect: "Yes branch executed; No branch did not"
  - id: false-takes-no
    when: run-instance
    given: "Value to Check resolves false"
    expect: "No branch executed; Yes branch did not"

known_bugs: []

training:
  learning_objectives:
    - "Create a Yes/No branch on a typed value + operation."
    - "Build a multi-part AND/OR condition with precedence."
  prerequisites: [expression-editor]
  common_mistakes:
    - "Wrong Value Data Type for the operand (operations are type-specific)."
    - "Confusing Yes/No path mapping."
  exercise: >
    Add a Condition that checks Initial Data.amount > 1000 and routes large vs small
    on the Yes/No paths.

provenance:
  confidence: V-real
  evidence: "FBB 'Application Processor' v4 — multiple Conditions (e.g. 'Is HSA Checking?': Initial Data.product_hsa_checking, BOOLEAN / CHECKBOX, IS TRUE). notes.md + screenshot 47. [NOTE: this citation is a non-authorized (NDA) workspace - flagged to Mark for the pending provenance remediation, not rewritten unprompted.] || FR-3352 DRIVEN 2026-08-31, Documentation Flows on dev.flowrunner.ai, TD Sandbox: a Condition with Value to Check bound to the Expression Editor's Null common value, Value Data Type JSON OBJECT. Operation HAS KEY with Key orderId -> Block Results shows Input 'Value to Check: null' and Output Success {\"conditionResult\": false}. Operation IS EMPTY on the same null -> Success {\"conditionResult\": false} as well. Neither failed the block, which is the FR-3352 fix (previously a null input failed the block for every check). Also observed: the block will not validate until a Yes or No connection is wired (\"One of the \\\"Yes\\\" or \\\"No\\\" connection must be connected\") and Run Block is disabled until then; the Operation list for JSON OBJECT is IS EMPTY / HAS KEY / HAS KEY WITH VALUE / HAS SPECIFIC TYPE / AI QUESTION; the Value Data Type list is STRING / INT / DOUBLE / BOOLEAN / CHECKBOX / DATETIME / JSON OBJECT / JSON ARRAY."
  verified_on: 2026-08-31
