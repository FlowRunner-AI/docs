id: handle-error
name: Handle Error
category: Utils
kind: native

api:
  element_type: ERROR_HANDLER
  config_keys: [storeResult, onFailElemId, logging]
  wiring: >
    Connect the failure-expecting block to this Handle Error as a successor (a
    normal connection); that makes it the block's failure handler. On the block's
    failure, control diverts here and continues down the handler's own successors
    (recovery path). One Handle Error can be shared by several blocks, or each
    error-expecting block can have its own.

testability:
  class: deterministic
  hermetic: true
  mock_strategy: "Make the guarded block fail (e.g. Cloud Code throw) to trigger the handler."

docs:
  purpose: >
    This block catches the failure of another block and sends the flow down a recovery path
    instead of stopping the run. It gives you a place to react when a step goes wrong.
  mental_model: |
    A Handle Error is the recovery path for a block that might fail. You connect a block that can
    go wrong to a Handle Error - the failure-prone block points to the handler, not the reverse -
    and from then on that block has two exits: its normal path when it succeeds, and the
    Handle Error when it fails. If the block fails, the flow does not stop; it diverts into the
    Handle Error and runs the steps you built after it - the recovery path. So a Handle Error is rarely the
    end of the line: it sits between the block it guards and the steps that react to the failure.

    Those recovery steps work only because the Handle Error hands them the error it caught. You read
    that error the same way you read any block's result - through the Handle Error's
    ((Reference Result Data As)) alias, {{Handle Error Result}} by default, in the Expression Editor.
    It carries a **message** describing what went wrong and a **source** naming the block that
    failed; some failures add a numeric **code**, but many carry none, so build your recovery on
    message and source. The source earns its place because one Handle Error can be the recovery path
    for several blocks at once - it is how you tell which of them actually failed. (Each risky block
    can also have its own Handle Error.)
  mental_model_image: ../images/reference/handle-error-recovery.png
  mental_model_alt: >
    A block that can fail - here an AI Agent - connected to a Handle Error as its error path, and the
    Handle Error connected onward to a Custom Cloud Code step, so a failure is caught and routed into
    a recovery step instead of ending the run.
  when_to_use: >
    Reach for it around any step that can fail for reasons outside your control: an HTTP Request
    to a service that might be down, a database write that might be rejected, a Custom Cloud Code
    block that might throw. You will find Handle Error in the **Utils** category of the block palette.
    Without one, the first failure ends the whole run; with one, the flow diverts into a recovery
    path you build instead. What to put in that recovery path - reacting to different error codes,
    and the retry, fallback, and notify patterns - is the subject of the Error Handling concept
    guide; this page covers the block itself.
  example:
    - text: >
        Suppose your flow hands some input to an AI Agent, and that step can fail - a transient model
        error, or input the agent cannot make sense of. With the AI Agent connected to a Handle Error
        (as in the diagram above), a failure no longer ends the run; it diverts into the recovery
        step you built after the handler - here a Custom Cloud Code block that alerts your team. That
        step's whole job is to read what went wrong and act on it.
    - text: >
        It reads the failure through the Handle Error's result. In the recovery step, open the
        Expression Editor on a field, switch to its **Block Data**, and there is {{Handle Error Result}}
        - the caught error, with its **message**, its **source**, and (when the failure provides one)
        its **code**:
      image: ../images/reference/handle-error-read.png
      alt: >
        The Expression Editor with Block Data selected and Handle Error Result expanded to its fields
        - code, message, and source - and the reference {{Handle Error Result->message}} built into
        the editor.
    - text: >
        Pick the field you need and it drops into the expression: {{Handle Error Result->message}}
        for the reason, {{Handle Error Result->source}} for the block that failed. A notification
        built from both - {{Handle Error Result->source}} failed: {{Handle Error Result->message}} -
        tells a person exactly which block broke and why.
    - text: >
        Whether a **code** is there depends on the failure: an HTTP call that comes back 500 carries
        one you can branch on, but a Custom Cloud Code block that throws carries none. The message and
        source are always present, so build your recovery on them and treat code as a bonus when it
        appears. What to do with the error once you have it - retry, fall back, or notify, and
        branching on code - is the subject of the Error Handling concept guide.
  config:
    - field: Reference Result Data As
      type: alias
      default: Handle Error Result
      description: >
        The alias later steps use to read the caught error in the Expression Editor, under Block
        Data. The error has a message and a source naming the block that failed, plus a numeric code
        when the failure provides one.
  common: [name, result_alias, assign_variable, notes]
  produces_result: true
  data_in: The error caught from the block that failed.
  data_out: The caught error - a message and a source, plus a code when the failure provides one - then the flow continues down the recovery steps.
  gotchas:
    - "You wire a Handle Error with an ordinary connection, drawn the right way round: the edge runs FROM the block you want to guard TO the Handle Error, and that edge becomes the block's error path. The block keeps its normal success path too, so the same block can lead two ways - onward when it succeeds, to the Handle Error when it fails."
    - "A failure in a block that is not connected to a Handle Error stops the run. Connect any step you cannot afford to have end the flow."
    - "Not every failure carries a code. An HTTP call that fails comes back with one - and it is FlowRunner's own numeric code, not the response's HTTP status - but a Custom Cloud Code block that throws produces none at all. The message and source are always there, so read those to log or report what happened, and branch on code only when you know the failure provides one."
    - "You read the caught error in a downstream block by referencing the Handle Error's result alias in the Expression Editor: open Block Data, expand {{Handle Error Result}}, and pick message, source, or code. It inserts as an expression like {{Handle Error Result->message}}."
    - "It carries very little configuration of its own, because its job is structural: it marks where a failed block's recovery begins. The real work lives in the steps you build after it."
  cross_refs: [wait, custom-cloud-code, http-request, error-handling-concept]
  terminology: [Handle Error, error code/message/source]

assertions:
  - id: catch-diverts-on-failure
    when: run-instance
    given: "a block with onFailElemId -> Handle Error, and the block throws"
    expect: "Handle Error executed; its recovery successor executed; flow did not terminate"
  - id: success-skips-handler
    when: run-instance
    given: "the guarded block succeeds"
    expect: "Handle Error not executed"

known_bugs: []

training:
  learning_objectives:
    - "Connect a risky block to a Handle Error and build a recovery path."
    - "Read the error shape (code/message/source)."
    - "Implement error -> backoff (Wait) -> retry."
  prerequisites: [custom-cloud-code, wait, instances-concept]
  common_mistakes:
    - "Wiring it backwards - the failure-prone block connects TO the Handle Error, not the Handle Error to the block."
    - "Leaving risky blocks unhandled (flow terminates on error)."
  exercise: >
    Guard an HTTP Request with a Handle Error that waits 30s and retries once, then
    routes to a notification on a second failure.

provenance:
  confidence: V-real
  evidence: "FBB 'Create IRA' (LIVE) — 'Create IRA' action onFailElemId -> Handle Error (storeResult) -> Create Object Operation. MyProjects 'Content Engine' uses Handle Error -> Wait -> retry. Error-object shape: { message, source (failing block's name), code (numeric FlowRunner code, NOT an HTTP status) }. CODE IS NOT ALWAYS PRESENT: product owner tested a Custom Cloud Code throw and got no code (2026-06-23); an HTTP/service failure does carry one. message + source are reliable. HOW TO READ verified live 2026-06-23 in scratch flow (AI Agent -> Handle Error -> Custom Cloud Code): a downstream block opens the Expression Editor -> Block Data -> 'Handle Error Result' (the Reference Result Data As alias) -> message/source/code; double-clicking a field inserts e.g. {{Handle Error Result->message}}. Expression Editor sample shape shown: code 500 / message 'Internal Server Error' / source 'Database Connection'. notes.md."
  verified_on: 2026-06-23
