id: return-result
name: Return Result
category: Utils
kind: native

api:
  element_type: COMPOSE_RESULT
  config_keys: [contentType, properties, logging, onFailElemId]

testability:
  class: deterministic
  hermetic: true
  mock_strategy: null

docs:
  purpose: >
    This block builds the object a flow hands back to whatever started it, and ends that path of
    the flow. You list the properties you want to send back, give each one a value, and that object
    becomes the flow's output.
  mental_model: >
    Think of it as the answer a flow gives back to its caller. You build that answer in the block's
    Compose Result list: each row is one property of the returned object, a name paired with an
    expression for its value, so you assemble the exact shape you want to send back - say
    { token, expiresAt } - from values the flow worked out along the way. When a path of the flow
    reaches this block, it composes that object and stops there: this block is terminal, so any
    blocks wired after it on the same path do not run. The composed object is what a Call Flow block
    waiting on this flow, or a SubFlow block running it, reads back as its result.
  when_to_use: >
    Reach for it at the end of any flow that another flow runs and reads back from - a flow invoked
    by a Call Flow block, or the steps inside a SubFlow block. Those callers only get back what a
    Return Result hands them, so this is how you decide what they see: the new record's id, a token,
    a status object, rather than the flow's whole internal workings. A flow with no Return Result
    still runs to completion, but it gives its caller nothing structured to read, so add this block
    whenever the caller needs an answer.
  example:
    - text: >
        Suppose you build a SubFlow named Issue Token that authenticates against a service and gets
        back an access token and how long it stays valid. Earlier steps in that subflow have already
        landed those two values - the token sits in a Data Bucket variable named accessToken, and the
        expiry in expiresAt. You want the parent flow that runs this subflow to read both back, and
        nothing else.
    - text: >
        Add a Return Result block at the end of the subflow. Leave Content Type on JSON, then add two
        rows to Compose Result - one property per row, each a name paired with an expression for its
        value:
    - lang: text
      code: |
        Content Type: JSON

        Compose Result:
          token       =  {{Data Buckets:Auth - accessToken->}}
          expiresAt   =  {{Data Buckets:Auth - expiresAt->}}
    - text: >
        When the subflow runs and a path reaches this block, it composes
        { "token": "...", "expiresAt": "..." } and ends there. Back in the parent flow, the SubFlow
        block's result is that object, so the next step can read the token through it and use it on a
        later call. Anything the subflow did to obtain the token stays inside the subflow - the caller
        sees only the two properties you chose to return.
    - image: ../images/reference/return-result-config.png
      alt: >
        The Return Result block with its configuration panel: a Content Type and a list of Property and Value rows that compose the result handed back to the calling flow.
  common: [name, logging, notes]
  config:
    - field: Content Type
      type: dropdown
      description: >
        The format of the returned data. The default is JSON, which composes the object from the
        rows below.
    - field: Compose Result
      type: repeatable property and value
      description: >
        The properties of the returned object. Each row is a property name paired with an expression
        that supplies its value. Together the rows make up the object the caller reads back.
  produces_result: true
  data_in: Composed property and value pairs.
  data_out: The returned object that the Call Flow or SubFlow caller reads back.
  gotchas:
    - "This block is terminal: it ends the path of the flow that reaches it. Any block wired after it on that same path does not run, so put it last and do not expect later steps on that branch to execute."
    - "If a flow has more than one Return Result block - for example one on each branch of a Condition - the caller does not get a single plain object. Instead it gets back a structure that holds the result from the first Return Result a run reaches, plus a list of every Return Result that ran, each tagged with the name of the block it came from, and an overall status. When you need the caller to read a simple object directly, keep to a single Return Result on the path it will take."
  cross_refs: [call-flow, subflow, condition]
  terminology: [Return Result, Compose Result, Content Type]

assertions:
  - id: returns-composed-object
    when: run-instance
    given: "Return Result with { ok: true, id: <expr> }"
    expect: "the caller (Call Flow/SubFlow) result == { ok:true, id:<value> }"

known_bugs: []

training:
  learning_objectives:
    - "Define a flow/subflow's output with Return Result."
    - "Understand single vs multiple Return Result structures."
  prerequisites: [call-flow, subflow, expression-editor]
  common_mistakes:
    - "Expecting blocks after Return Result to run (it's terminal)."
  exercise: >
    Make a SubFlow that composes and returns { token, expiresAt }, then consume it from
    a Call Flow.

provenance:
  confidence: V-real
  evidence: "FBB 'Application Processor' v4 + many FBB/MyProjects flows use COMPOSE_RESULT as terminal. Config (Content Type JSON + Property/Value) from scratch capture. notes.md."
  verified_on: 2026-06-14
