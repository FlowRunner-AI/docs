id: return-result
name: Return Result
category: Utils
kind: native

api:
  element_type: COMPOSE_RESULT
  config_keys: [contentType, properties, logging, onFailElemId]

testability:
  class: deterministic
  hermetic: true
  mock_strategy: null

docs:
  purpose: >
    This block lets you decide exactly what a caller sees back from a flow. You name the properties to
    return and give each a value, and the caller reads back only that object - the id, the token, the
    status you chose to expose - while everything the flow did to produce it stays hidden inside.
  mental_model: |
    A flow can do a lot of work, but a caller does not need to see all of it - it needs an answer.
    Return Result is where you compose that answer. Its ((Content Type)) sets the format the caller
    receives - ((JSON)), ((XML)), or ((Plain Text)). Under JSON, the ((Compose Result)) toggle decides how
    you build it. With it on, you compose an object from a list of ((Property)) and ((Value)) rows,
    each row a name paired with an expression: you assemble the exact shape you want to hand back -
    say { token, expiresAt } - from values the flow worked out along the way, and nothing else leaks
    out. With it off - and always under XML and Plain Text - the block hands back a single value from one
    ((Result)) expression instead, for when the answer is just one thing. Either way, the caller reads back
    only what you returned and never sees the rest.

    The block is also terminal: it has no outbound connector, so nothing can be wired after it. When a
    path of the flow reaches it, the object is composed and that path ends there. The composed object is
    what a Call Flow block waiting on this flow, or a SubFlow block running it, reads back as its
    result. The parent reads it through that caller block's result alias - if the Call Flow block is
    named Issue Token, a later step in the parent reads a returned property as
    {{Issue Token Result->token}}, built in the Expression Editor under Block Data.
  when_to_use: >
    Reach for it - it lives in the block list's Utils group - at the end of any flow that another
    flow runs and reads back from: a flow invoked by a Call Flow block, or the steps inside a SubFlow
    block. Those callers only get back what a
    Return Result hands them, so this is how you decide what they see: the new record's id, a token,
    a status object, rather than the flow's whole internal workings. A flow with no Return Result
    still runs to completion, but it gives its caller nothing structured to read, so add this block
    whenever the caller needs an answer.
  sections:
    - title: Returning more than one result
      body: |
        A flow does not always have a single way out. Put a Return Result on each branch of a
        Condition and a run reaches one or the other depending on which way it forked. That is still
        one result per run, and the caller reads back the plain composed object from whichever
        block the run reached.

        What changes the shape is how many results a single run produces. When a run reaches more
        than one Return Result - two parallel branches that each end in one, say - or none at all, the
        caller does not get back a single plain object. It gets back an envelope that wraps up
        everything the run returned:

        - the **first result** - the object from the first Return Result the run reached, so a caller
          that only wants "the answer" has one to read;
        - the **list of all results** that ran, each one tagged with the name of the Return Result
          block it came from, so a caller can tell the branches apart and pick out the one it cares
          about;
        - an overall **status** for the run.

        So the shape depends on the run, not on how many Return Result blocks the flow contains. When
        you want the caller to read a simple object directly, make sure a run can reach only one
        Return Result; when several can run in the same pass, expect the envelope and read the result
        you want out of it by the block name that produced it. The exact envelope is shown on
        [Call Flow (Blocking)](../api/call-flow-blocking.md#response).

        Switching on ((Release Caller)) changes when the caller hears back rather than what: the moment
        the run reaches that block, the caller receives that block's composed value and is released,
        while the run carries on with whatever else it still has to do. Its help text puts it as
        "the flow sends the Return Result output back to the caller immediately and continues
        executing. Applies only to synchronous calls." Leave it off when the caller should wait for the
        whole run.
  example:
    - text: >
        Suppose you build a SubFlow named Issue Token that authenticates against a service and gets
        back an access token and how long it stays valid. Earlier steps in that subflow have already
        landed those two values - the token sits in a Data Bucket variable named accessToken, and the
        expiry in expiresAt. You want the parent flow that runs this subflow to read both back, and
        nothing else.
    - text: >
        Add a Return Result block at the end of the subflow. Leave ((Content Type)) on JSON, then add two
        rows to ((Compose Result)) - one property per row, each pairing a ((Property)) name with a ((Value))
        expression:
    - lang: text
      code: |
        Content Type: JSON

        Compose Result:
          token       =  {{Data Buckets:Auth - accessToken->}}
          expiresAt   =  {{Data Buckets:Auth - expiresAt->}}
    - text: >
        When the subflow runs and a path reaches this block, it composes
        { "token": "...", "expiresAt": "..." } and ends there. Back in the parent flow, the result of
        the block that ran the subflow is that object, and you read each property through that block's
        result alias. If the SubFlow block is named Issue Token, the next step reads the token in the
        Expression Editor (under Block Data) as {{Issue Token Result->token}} and uses it on a later
        call:
    - lang: text
      code: |
        Authorization  =  Bearer {{Issue Token Result->token}}
    - text: >
        Anything the subflow did to obtain the token stays inside the subflow - the caller sees only
        the two properties you chose to return.
    - image: ../images/reference/return-result-config.png
      alt: >
        The Return Result block with its configuration panel: a Content Type and a list of Property and Value rows that compose the result handed back to the calling flow.
  common: [name, logging, notes]
  config:
    - field: Content Type
      type: dropdown
      description: >
        The format of the returned data. The default is JSON, which composes the object from the
        rows below.
    - field: Compose Result
      type: repeatable property and value
      description: >
        The properties of the returned object. Each row is a property name paired with an expression
        that supplies its value. Together the rows make up the object the caller reads back.
    - field: Release Caller
      type: toggle
      description: >
        Off by default. When on, the caller receives this block's value as soon as the run reaches it
        and is released, while the run continues; when off, a waiting caller hears back only once the
        run finishes. Applies to synchronous callers, such as the blocking Call Flow API.
  produces_result: true
  data_in: Composed property and value pairs.
  data_out: The returned object that the Call Flow or SubFlow caller reads back.
  gotchas:
    - "This block is terminal: it has no outbound connector, so nothing can be wired after it. The path that reaches it ends there - put it where that path's work is finished."
    - "The shape the caller reads back depends on how many Return Result blocks a single run reaches, not on how many the flow contains. One reached (for example one branch of a Condition) - the plain composed object. None, or more than one in the same run - an envelope holding the first result, a list of every result tagged with the block name that produced it, and the run's status. When you need the caller to read a simple object directly, make sure a run can reach only one Return Result."
  cross_refs: [call-flow, subflow, condition]
  terminology: [Return Result, Compose Result, Content Type, Release Caller]

assertions:
  - id: returns-composed-object
    when: run-instance
    given: "Return Result with { ok: true, id: <expr> }"
    expect: "the caller (Call Flow/SubFlow) result == { ok:true, id:<value> }"

known_bugs: []

training:
  learning_objectives:
    - "Define a flow/subflow's output with Return Result."
    - "Understand single vs multiple Return Result structures."
  prerequisites: [call-flow, subflow, expression-editor]
  common_mistakes:
    - "Expecting blocks after Return Result to run (it's terminal)."
  exercise: >
    Make a SubFlow that composes and returns { token, expiresAt }, then consume it from
    a Call Flow.

provenance:
  confidence: V-real
  evidence: "FBB 'Application Processor' v4 + many FBB/MyProjects flows use COMPOSE_RESULT as terminal. Config (Content Type JSON + Property/Value) from scratch capture. notes.md. 2026-08-18 (Documentation Flows, flow Order Lookup, driven over the blocking Call Flow API): one Return Result reached of two (Condition branches) -> plain composed object; none reached -> envelope with result null; two reached (parallel branches) -> envelope {executionId, status, result, results[{blockName, contentType, data}], apiCallerReleased}; Release Caller ON on the reached block -> the caller received that block's value at once (t~3-4s) while the other branch finished at t~8s; Content Type XML -> application/xml, Plain Text -> text/plain. Panel: Content Type (JSON | XML | Plain Text), Compose Result toggle, Release Caller toggle + tooltip. Log: automations/.cache/api-spec/verification-2026-08-18.md."
  verified_on: 2026-08-18
