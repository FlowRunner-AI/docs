id: subflow
name: SubFlow
category: Subflows
kind: native

api:
  group_type: SUBFLOW
  config_keys: [subFlowId, subFlowVersionId, initialData, initialDataParams, storeResult, onFailElemId]

testability:
  class: deterministic
  hermetic: true
  mock_strategy: "Reference a hermetic test subflow."

docs:
  purpose: >
    This block runs a reusable set of steps - a subflow - as a single step inside your flow.
    You define those steps once, then drop this block in wherever you need them, handing it the
    values it should work with and reading back what it produces.
  mental_model: >
    A subflow is a named, self-contained set of steps that lives inside your flow and can be placed
    more than once. When the flow reaches this block, it runs that set of steps as one unit, using
    the values you pass in, and the value those steps hand back with their Return Result block
    becomes this block's result. Because every placement points at the same definition, editing the
    steps once updates every place they run. To open the steps and edit them, you step into the
    block - hover it and choose Expand - and use Return at the top-left to come back out, the same
    way you work inside any block container.
  when_to_use: >
    Reach for it when the same handful of steps shows up in more than one spot in a flow and you do
    not want to rebuild or copy them each time - refreshing an access token before two different
    calls, or formatting a record the same way in several branches. Keeping that work as one subflow
    means a change lands everywhere it runs, instead of being fixed in one place and forgotten in
    another. The trade-off against a Call Flow block is reach: a subflow stays inside this one flow,
    so if the same logic also needs to run from other flows, build it as its own flow and use a
    Call Flow block instead.
  example:
    - text: >
        Suppose a flow makes two calls to a service that expects a fresh access token on each call,
        and the token expires quickly. Rather than build the get-a-token steps twice, you build them
        once as a subflow named Get New Token. Inside it, an HTTP Request authenticates and a Return
        Result block hands back the token it obtained:
    - lang: text
      code: |
        Inside the Get New Token subflow:
          HTTP Request   ->  POST /oauth/token   (authenticate)
          Return Result  ->  { token: <the access token from the response> }
    - text: >
        Now place a SubFlow block before the first call, point it at Get New Token, and map the one
        value those steps need to start. Each input is a name paired with an expression: the name has
        to match a value the subflow expects, and the expression is where it comes from here:
    - lang: text
      code: |
        SubFlow:  Get New Token

        Input parameters:
          clientId  <-  {{Data Buckets:Auth - clientId->}}
    - text: >
        When the flow reaches the block, the Get New Token steps run as one unit and their Return
        Result hands back an object like `{ "token": "ey..." }`. That object becomes this block's
        result, so the next step reads the token from it and uses it on the first call. Place a second
        SubFlow block - again pointing at Get New Token - before the second call, and it produces a
        fresh token the same way. Because both placements run the one definition, the day the token
        endpoint changes you edit Get New Token once and both calls pick up the fix.
  common: [name, result_alias, notes]
  config:
    - field: SubFlow
      type: reference
      description: >
        Required. The subflow whose steps this block runs. You pick from the subflows defined for
        this flow, and the block always runs the version you selected.
    - field: Input parameters
      type: repeatable name and expression
      description: >
        The values handed to the subflow to work with. Each row pairs a name, which has to match a
        value the subflow expects, with an expression that supplies it from this flow.
  produces_result: true
  data_in: The mapped input parameters (each from an expression).
  data_out: The object the subflow's Return Result block hands back.
  gotchas:
    - "A subflow cannot contain another SubFlow block - you cannot place a subflow inside a subflow."
    - "The subflow only hands a result back if its steps reach a Return Result block. Without one, this block runs the steps but gives the rest of the flow nothing structured to read."
    - "Editing a subflow's steps changes every placement of it in the flow, since they all run the one definition. A fix in one place is a fix everywhere - which is the point, but means a change is never local to a single placement."
  cross_refs: [call-flow, return-result]
  terminology: [SubFlow]

assertions:
  - id: subflow-returns-result
    when: run-instance
    given: "a SubFlow that Return Results { token } and is passed creds"
    expect: "this block's result == { token }"

known_bugs: []

training:
  learning_objectives:
    - "Extract repeated logic into a reusable SubFlow."
    - "Distinguish SubFlow (inline reuse) from Call Flow (separate flow)."
  prerequisites: [return-result, call-flow]
  common_mistakes:
    - "Trying to nest SubFlows."
    - "Confusing SubFlow with Call Flow."
  exercise: >
    Create a 'Get New Token' SubFlow used twice in one flow; confirm both placements
    reflect edits to the shared logic.

provenance:
  confidence: V-real
  evidence: "FBB 'GetCustomerMatches' (LIVE) — SUBFLOW 'Get New Token' (subFlowId/subFlowVersionId, initialDataParams). notes.md."
  verified_on: 2026-06-14
