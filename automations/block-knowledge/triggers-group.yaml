id: triggers-group
name: Triggers Group
category: Groups
kind: native

api:
  group_type: TRIGGERS
  config_keys: [transitionMode, occurWithin, occurrenceTimeUnit, storeResult, onFailElemId]
  inner_blocks: "trigger elements with element.groupId == this group's id"

testability:
  class: external          # depends on real trigger events
  hermetic: false
  mock_strategy: "Fire trigger events via their callback URLs / Learning Mode; or stub."

docs:
  purpose: >
    This block lets you hold several triggers together and start the flow on whichever one fires
    first, or hold the flow back until a whole set of them has fired within a time window you set.
    One trigger on its own can only react to one kind of event; a Triggers Group lets a single point
    in the flow wait on several at once and choose how their arrivals release it.
  mental_model: |
    A Triggers Group is a block container for triggers. Instead of a single trigger starting the
    flow on its own, you place two or more triggers inside the group, and the group decides when the
    flow moves on based on which of them have fired. The triggers inside have no order and none is
    the "main" one - the group watches them all and waits.

    How it waits is set by the group's own ((Outgoing Transition Mode)), a setting on the Triggers
    Group block. In the "When at least one trigger occurs" mode the group lets the flow continue the
    moment the first of its triggers receives an event, and the rest are no longer waited on - the
    triggers race, and the winner releases the flow. In the "When all triggers start within the time
    set below" mode the group holds the flow back until every trigger inside it has fired, and
    continues only if they all do so inside a timeframe you set.
  mental_model_image: ../images/reference/triggers-group-mode.png
  mental_model_alt: >
    The Triggers Group's Outgoing Transition Mode, with its two choices - "When at least one trigger
    occurs" (the race) and "When all triggers start within the time set below" (the rendezvous).
  when_to_use: >
    Reach for it when more than one inbound event could, or should, move your flow forward, and a
    single trigger cannot express that. The "When at least one trigger occurs" mode suits a race - you are waiting on
    whichever of several events shows up first, like an approval that might arrive by email or by a
    webhook, and you act on the first one. The "When all triggers start within the time set below" mode suits a rendezvous -
    you need several events to have all happened close together before you proceed, like waiting for
    both a payment confirmation and a shipping confirmation within an hour. If only one event ever
    matters, a single trigger on its own is the simpler choice; the group earns its place once the
    decision spans several triggers at once.
  sections:
    - title: Waiting for a set of triggers (the rendezvous mode)
      body: |
        The rendezvous mode is the one with a timeframe. With ((Outgoing Transition Mode)) set to
        "When all triggers start within the time set below", the group stops racing: instead of
        releasing the flow on the first arrival, it holds the flow back until every trigger inside it
        has fired - and continues only if they all fire inside a window you set.

        You set that window in the ((Time Period)), as a number and a unit - the unit can be Seconds,
        Minutes, Hours, or Days - so 30 and Minutes, say, or 1 and Hours. The window is the whole
        condition: every trigger in the group has to fire inside it. If
        the window passes with even one trigger still waiting, the all-fire condition is not met and
        the flow does not move on.
      image: ../images/reference/triggers-group-config.png
      alt: >
        A Triggers Group with its Outgoing Transition Mode set to "When all triggers start within the
        time set below" and a Time Period of 30 Minutes - the window inside which every trigger in the
        group must fire for the flow to continue.
  example:
    - text: >
        Suppose a run pauses partway through and should resume as soon as approval comes in, but
        approval might arrive two different ways - a manager clicking a link in an email, or an
        upstream system posting to a webhook. Put two External Callback triggers inside a Triggers
        Group: one whose ((Callback URL)) the email link points at, and one whose ((Callback URL)) the
        upstream system posts to.
    - image: ../images/reference/triggers-group-example.png
      alt: >
        Two named External Callback triggers - Email Approval and Webhook Approval - inside the
        Triggers Group, with no connection between them, so whichever fires first releases the flow.
    - text: >
        Set the group's ((Outgoing Transition Mode)) to the "When at least one trigger occurs" mode. Now whichever event
        arrives first - the click or the post - releases the flow, and the second is no longer
        waited on. The flow continues without you having to wire up branching logic to watch both
        paths yourself, and without caring which channel the approval came through.
  config:
    - field: Outgoing Transition Mode
      type: dropdown
      description: >
        Required. How the group decides to continue. One choice continues as soon as any single
        trigger inside it fires; the other continues only after every trigger has fired within the
        time window you set below.
    - field: Time Period
      type: number + unit
      description: >
        The length of the time window for the "When all triggers start within the time set below" mode, given as a number and a unit (for
        example 30 and Minutes). Every trigger must fire inside this window for the group to
        continue. It does not apply to the "When at least one trigger occurs" mode.
  produces_result: true
  data_in: The events arriving at the triggers inside the group.
  data_out: The flow continues once the group's transition condition is met.
  gotchas:
    - "The triggers in the group have no order and no priority - the group reacts to whichever of them fire, not to a particular one."
    - "If you choose the 'When all triggers start within the time set below' mode, you have to set a time window. Without one there is no defined period for the triggers to all fire inside."
    - "The group itself does not produce a combined result for later steps to read. Each trigger inside it still exposes its own data under its own alias, so read those individually."
  cross_refs: [actions-group, external-callback]
  terminology: [Triggers Group, Outgoing Transition Mode]

assertions:
  - id: one-occur-proceeds
    when: run-instance
    given: "two triggers, ONE_OCCUR, one fires"
    expect: "flow proceeds after the first trigger"

known_bugs: []

training:
  learning_objectives:
    - "Coordinate multiple triggers with a group."
    - "Choose ONE_OCCUR vs all-within-timeframe."
  prerequisites: [external-callback, triggers-concept]
  common_mistakes:
    - "Using all-within mode without a timeframe."
  exercise: >
    Group two External Callback triggers (ONE_OCCUR) so either inbound event resumes the
    flow.

provenance:
  confidence: V-config
  evidence: "Schema from scratch flow (TRIGGERS group: transitionMode ONE_OCCUR, occurWithin/occurrenceTimeUnit). Outgoing Transition Mode option labels verified live 2026-06-19 (two radio choices: 'When at least one trigger occurs' / 'When all triggers start within the time set below'). Behavior (window/race semantics) still schema-inferred, not run. notes.md."
  verified_on: 2026-06-14
