id: shared-memory-put
name: "Shared Memory: Put"
category: Actions
kind: native

api:
  element_type: ACTION
  meta_type: SHARED_MEMORY
  subtype: PUT
  config_keys: [override, changes, storeResult, onFailElemId, logging]

testability:
  class: deterministic
  hermetic: true
  mock_strategy: null

docs:
  purpose: >
    This block saves one or more values into Shared Memory, the flow's own key/value store. You
    name each value and supply what to store, and the value is kept under that name for later runs
    of the flow to read.
  mental_model: >
    You give the block a set of name-and-value pairs, and it writes each one into Shared Memory
    under its name. What makes this stick is that Shared Memory belongs to the flow and holds onto
    what you save between runs: a value one run writes is still there for the next run to read,
    where a Data Bucket variable would have been wiped clean when the run ended. The value you
    store can be a fixed value you type or an expression worked out at run time, so you can save
    the result of earlier steps. Writing to a name that already holds a value updates it in place;
    writing to a new name creates it.
  when_to_use: >
    Reach for it when a piece of state has to outlive a single run of the flow - a running counter,
    a cursor marking how far you got last time, a token you want to reuse next run. A Data Bucket
    variable resets every run and cannot carry anything forward, so it is the wrong tool for state
    that has to persist; Shared Memory is the store that remembers. In practice you pair this with
    a matching Shared Memory: Read at the top of the flow: the Read pulls the saved value in, the
    flow works with it, and this block writes the updated value back, so the two together carry
    state forward run after run.
  example:
    - text: >
        Suppose you want a flow to number each run it makes - run 1, run 2, run 3 - even though
        each run starts fresh and remembers nothing on its own. The trick is to keep the count in
        Shared Memory under a name like `runCount`, read it at the start of every run, add one, and
        write the new total back with this block.
    - text: >
        Early in the flow a Shared Memory: Read block reads `runCount`, with its **Default Value**
        set to `0` so the very first run (when nothing has been saved yet) gets a clean starting
        point. The flow adds one to whatever it read, and at the end a Shared Memory: Put block
        writes the new total back. In the Put block's **Perform Changes** list you add one entry:
        the name is `runCount`, and the value is the expression that adds one to the count the Read
        returned.
    - image: ../images/reference/shared-memory-put-config.png
      alt: >
        The Shared Memory Put block on the canvas with its configuration panel open, showing one
        entry under Perform Changes whose name is runCount and whose value is an expression that
        adds one to the value read earlier.
    - text: >
        On the first run, the Read returns the Default Value `0`, the flow works out `1`, and this
        block writes `1` to `runCount`, replacing the old value in place. The next run reads `1`,
        works out `2`, and writes `2`; the run after that reads `2` and writes `3`. The number
        climbs run after run because Shared Memory holds onto it between runs, which a Data Bucket
        variable could never do.
  config:
    - field: Perform Changes
      type: repeatable name + value
      description: >
        The list of values to save. Each entry has a name (the key it is stored under in Shared
        Memory) and a value, which can be a fixed value you type or an expression. Add a row for
        each value you want to write in one go.
    - field: Override
      type: toggle
      default: true
      description: >
        When on, writing to a name that already holds a value replaces it with the new value.
        Confirm the off behavior in-product before documenting it.
  produces_result: false
  data_in: One or more name/value pairs to store.
  data_out: The values written into Shared Memory, kept for later runs.
  gotchas:
    - "Shared Memory keeps what you save between runs of the flow, unlike a Data Bucket variable, which resets every run. That is the whole point of using it, but it also means a value lingers until something overwrites or clears it."
    - "This block does not hand back a result you can reference in later blocks - it writes to the store rather than producing a value. To use what you saved, read it back with a Shared Memory: Read block."
    - "Writing to a name that already holds a value updates it. If you mean to add to a value rather than replace it - bump a counter, append to a list - read the current value first, work out the new one, and write that back; the block does not combine the new value with the old one for you."
  cross_refs: [shared-memory-read, shared-memory-delete]
  terminology: [Shared Memory, Override]

behavior:
  - "Saves each name/value pair into Shared Memory, where it is kept for later runs of the flow to read."
  - "With Override on, writing to a name that already holds a value replaces it; writing to a new name creates it."

assertions:
  - id: put-persists
    when: run-instance
    given: "Put 'count'=1"
    expect: "a later instance's Read 'count' == 1"

known_bugs: []

training:
  learning_objectives:
    - "Persist cross-instance state with Put."
    - "Understand Override semantics."
  prerequisites: [shared-memory-read]
  common_mistakes:
    - "Assuming Set Variables persists (it doesn't — use Put)."
  exercise: >
    See shared-memory-read exercise (counter pattern).

provenance:
  confidence: V-run
  evidence: "MyProjects 'Flow Memory' v1 — Put 'Number of times I ran' = timesRan (Override on); instance output 1/2/3. notes.md."
  verified_on: 2026-06-13
