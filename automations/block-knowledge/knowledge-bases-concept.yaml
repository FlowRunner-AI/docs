id: knowledge-bases-concept
name: "Knowledge Bases (RAG stores)"
category: Concepts
kind: native
concept: true

api:
  # A workspace-level resource (not a block). Nav: Agent tools & Knowledge → Knowledge Bases.
  # URL: /app/<ws>/knowledge-base/<kbId>/setup  and  .../data
  surface: "Knowledge Bases section (collapsible nav group + '+' to create; per-KB Setup + Data tabs)"

docs:
  purpose: >
    A Knowledge Base is a searchable store of your own documents that an AI Agent can draw on
    to answer questions. You add documents to it, and the AI can later pull back the passages
    that match what it was asked.
  mental_model: >
    A Knowledge Base is a place you put documents so an AI can find the parts that matter. When
    you add a document, FlowRunner does not store it as one long block of text. It breaks the
    document into smaller pieces, called chunks, and turns each chunk into an embedding - a list
    of numbers that captures the meaning of that piece of text. Those embeddings live in a vector
    store, which is built to compare meanings and return the closest matches. So when an AI Agent
    asks the Knowledge Base a question, the question is turned into an embedding too, and the
    store hands back the chunks whose meaning is nearest. That is how a Knowledge Base answers
    from your content instead of from the model's general training.

    You set this up in two parts. The Setup tab is the configuration: a title and description, an
    Embedding Model that decides how text becomes numbers, the chunk size and overlap that decide
    how documents are sliced, and the vector store where the embeddings are kept. The Data tab is
    the content: the documents themselves, which you add, rename, and remove there.
  when_to_use: >
    Reach for a Knowledge Base when you want an AI Agent to answer from facts you supply - a
    product manual, a policy handbook, a set of support articles - rather than from whatever the
    model already knows. It keeps answers grounded in your material and lets you update what the
    AI knows by changing documents instead of retraining anything. The trade-off is that it is a
    standing resource you configure and feed, not a single block you drop into a flow, so it is
    worth setting up when an agent needs real, current domain knowledge, and overkill when a
    short fixed instruction in the agent's prompt would do.
  ui:
    tabs: [Setup, Data]
    setup:
      knowledge_details:
        - field: Knowledge Title
          editable_after_create: true
        - field: Description
          editable_after_create: true
      ai_setup:   # the embedding configuration
        - field: Provider
          example: "Open AI"
          editable_after_create: false
          note: "AI provider for embeddings (from the API Keys registry; e.g. OpenAI, Voyage AI)."
        - field: Model
          example: "text-embedding-3-small (create-dialog label 'Text Embedding 3 Small')"
          editable_after_create: false
        - field: API Key
          editable_after_create: true
          note: "Pick a saved API Key Setup or enter a new key; 'Save as Setup' stores it in the API Keys registry. Key IS editable post-create (rotate without rebuilding)."
        - field: Chunk Size
          default: 2000
          editable_after_create: false
          help_tooltip: "Maximum size of each text chunk in characters. Larger chunks preserve more context but may be less precise for retrieval."
        - field: Chunk Overlap
          default: 300
          editable_after_create: false
          help_tooltip: "Number of characters to overlap between consecutive chunks. Overlap helps maintain context across chunk boundaries."
      vector_store:
        - field: Provider
          example: "In Memory"
          editable_after_create: false
          note: "In Memory = TESTING ONLY, data lifetime 6 hours (non-extendable) — per the ⚠ tooltip. A persistent vector-store option also exists (exact option list TO CONFIRM)."
    data_tab: >
      Manage documents: add (upload/content), list, rename, delete (per-doc ⋯ menu + top-bar
      file-plus / refresh / trash). Ingestion is ASYNC — a document shows Processing → Completed.
  gotchas:
    - "The embedding model, chunk size, chunk overlap, and vector store are set when you create the Knowledge Base and lock once it holds any documents. You cannot change how existing content was sliced or embedded after the fact, so choose these with care up front - to switch, you create a fresh Knowledge Base and add the documents again. The title, description, and API Key stay editable, so you can rename it or rotate the key at any time."
    - "The In Memory vector store is meant for testing only. Anything you add to it is kept for about six hours and then dropped, and that window cannot be extended. For content that has to stick around, pick a vector store that persists."
    - "Adding a document is not instant. A new document shows as Processing while it is being chunked and embedded, and only becomes searchable once it reaches Completed. A query run right after you add will not find content that is still processing."
  cross_refs: [knowledge-base-add-document, knowledge-base-list-documents, knowledge-base-delete-document, knowledge-base-delete-by-filter, ai-agent, api-keys-registry]
  terminology: [Knowledge Base, RAG, Embedding Model, Chunk Size, Chunk Overlap, Vector Store, Document, Metadata]

behavior:
  - "When you add a document, it is split into chunks, each chunk is turned into an embedding, and the embeddings are saved in the vector store - which is what makes the content searchable by meaning."
  - "An AI Agent draws on a Knowledge Base by attaching it as a capability, and a flow can add, list, or remove documents using the Knowledge Base action blocks."

assertions:
  - id: setup-locked-once-data-added
    when: ui
    given: "an existing KB that has data, on its Setup tab"
    expect: "Provider, Model, Chunk Size, Chunk Overlap, Vector Store are read-only; Title/Description/API Key editable"
    note: "Configurable at creation (Create dialog); locked once documents exist."
  - id: add-then-query
    when: run-instance
    given: "Add Document then (after processing) a retrieval"
    expect: "the new content is retrievable once Processing -> Completed"

known_bugs: []

training:
  learning_objectives:
    - "Create a KB: pick embedding model, chunking, and vector store (all locked after)."
    - "Understand In-Memory (testing, 6h) vs persistent vector store."
    - "Feed a KB to an AI Agent and manage documents with the KB blocks."
  prerequisites: [api-keys-registry, ai-agent]
  common_mistakes:
    - "Expecting to change the embedding model/chunking later (it's immutable after create)."
    - "Using In-Memory for anything but testing (data expires in 6h)."
    - "Querying immediately after Add (ingestion is async)."
  exercise: >
    Create a test KB (Text Embedding 3 Small, In Memory), add a doc with metadata on the Data
    tab, wait for Completed, then List Documents with a metadata filter to confirm.

provenance:
  confidence: V-real
  evidence: >
    Tests workspace 'Test KB' Setup inspected live: Provider Open AI, Model text-embedding-3-small,
    Chunk Size 2000, Chunk Overlap 300, Vector Store In Memory; fields disabled-state confirmed
    (only Title/Description/API Key editable). Create dialog confirmed fields + verbatim Chunk
    help texts. In-Memory 6h from earlier ⚠ tooltip. notes.md. TO CONFIRM: full Embedding Model
    + Vector Store option lists.
  verified_on: 2026-06-15
