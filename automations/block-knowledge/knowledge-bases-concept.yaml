    removed. All three storage-configuration forms driven and tooltips captured verbatim (ui
    block). Embedding Model option list confirmed: grouped by Open AI / Google Gemini AI /
    Mistral AI / Cohere / Voyage AI, default Text Embedding 3 Small. Chunk defaults 2000/300 +
