id: flow-scheduling-concept
name: "Flow Scheduling (Configure Flow Schedule)"
category: Concepts
kind: native
concept: true

api:
  # Not a block — a per-flow-version setting stored at metaInfo.schedule on the flow version.
  storage: "flow version metaInfo.schedule"
  schedule_schema:
    enabled: "bool — whether the schedule is actively creating instances (toggled by Start/Stop Scheduled Runs blocks)"
    frequency: "{ schedule: 'custom'|..., repeat: { every: N } } — the cadence"
    startDate: "epoch ms — when scheduling begins (UI 'Start')"
    endDate: "epoch ms | null — null = Never (UI 'Expire')"
    onlyScheduledInitiations: "bool — UI 'Allow only scheduled flow instances'"
    allowApiInitiationsWhenScheduleExpired: "bool — UI 'Allow flow instantiation via API when the schedule expires'"

docs:
  purpose: >
    Flow scheduling starts a flow on its own, on a timetable you set, so it runs without
    anyone or anything kicking it off. You set it up in the Configure Flow Schedule popup.
  mental_model: >
    A schedule is a timetable you attach to one version of a flow. You give it a start time, a
    frequency, and an end (or no end), and from then on FlowRunner starts a fresh run of that
    flow every time the timetable comes due - each run is a new Instance with its own data,
    exactly as if a trigger had fired it. You open the popup from the clock icon in the flow
    editor's top toolbar, or from the Flow Schedule card on the Version Admin tab. Frequency is
    where you pick the cadence: a single run at the start time, every few seconds, daily,
    weekly, monthly, or a Cron expression for a custom timetable. Expire sets when the timetable
    stops - leave it on Never for no end, or set an end date.

    There are two separate ideas here, and keeping them apart saves a lot of confusion. One is
    the schedule's DEFINITION - the start, frequency, and end you typed into this popup. The
    other is whether that schedule is currently switched on and producing runs. This popup
    defines the schedule; the Start Scheduled Runs and Stop Scheduled Runs blocks switch it on
    and off from inside a flow, without changing the definition you set here.
  when_to_use: >
    Reach for a schedule whenever a flow should start itself on a timetable rather than waiting
    for a trigger, an API call, or a manual launch - a nightly cleanup job, a poll that checks
    a source every few minutes, a weekly report, a recurring batch of emails. The trade-off to
    weigh is control: a schedule starts runs on the clock whether or not there is anything to
    do, so for work that should start in response to an event (a record changed, a request came
    in) a trigger fits better. Pick a schedule when the timing itself is the thing that should
    drive the flow.
  ui:
    open_via:
      - "Clock icon ('Schedule', lucide-clock3) in the flow editor top toolbar."
      - "Version Admin tab -> Flow Schedule card (same popup)."
    fields:
      - field: Start
        type: date/time picker
        description: When the schedule begins (schedule.startDate).
      - field: Frequency
        type: dropdown
        options: [Once, "Every X seconds", Daily, Weekly, Monthly, Cron]
        description: >
          Once = single run at Start. Every X seconds / Daily / Weekly = "Repeat every" [N]
          (+ Weekly adds an 'On' day-of-week picker). Monthly = Months + Days + Day-Of-Month/Week.
          Cron = a cron expression ("Configure Cron Expression").
      - field: Expire
        type: dropdown
        options: [Never, "On date"]
        description: Never = no end (endDate null); On date reveals a 2nd date/time picker (schedule.endDate).
      - field: "Flow Execution Policy: Allow only scheduled flow instances"
        type: checkbox (onlyScheduledInitiations)
        help_tooltip: "When this option is enabled, new flow instances are created solely by the schedule, not by trigger invocations. If the flow begins with a trigger, there must already be a running instance of the flow created by the schedule for the trigger invocation to be accepted. This differs from traditional flow execution, where activating the first trigger created a new flow instance."
      - field: "Flow Execution Policy: Allow flow instantiation via API when the schedule expires"
        type: checkbox (allowApiInitiationsWhenScheduleExpired)
        help_tooltip: "When this option is enabled and the flow's schedule has expired, a new flow instance can be created by using the 'Call Flow' API."
    buttons: [REMOVE SCHEDULING, CANCEL, SAVE]
  gotchas:
    - "A schedule belongs to one version of the flow, not to the flow as a whole. If you publish a new version, check that the version meant to run on the timetable is the one carrying the schedule."
    - "Defining a schedule here is not the same as switching it on. This popup sets the timetable; the Start Scheduled Runs and Stop Scheduled Runs blocks turn that timetable on and off from inside a flow. Stopping it pauses the runs but keeps the timetable you set."
    - "REMOVE SCHEDULING and Stop Scheduled Runs are not the same thing. REMOVE SCHEDULING deletes the timetable outright, so there is nothing left to restart - you would have to set it up again. Stop Scheduled Runs only pauses an existing timetable, and a later Start Scheduled Runs picks it back up unchanged."
    - "Allow only scheduled flow instances changes how triggers behave. With it on, only the schedule creates new runs - a trigger no longer starts a fresh run on its own. If the flow begins with a trigger, a scheduled run has to already be going for that trigger to be accepted, which is different from the usual behavior where the first trigger starts a new run."
    - "Allow flow instantiation via API when the schedule expires is what lets the Call Flow API still start a run after the timetable's end date has passed. Without it, an expired schedule means no new runs from that path either."
  cross_refs: [start-scheduled-runs, stop-scheduled-runs, call-flow, triggers-group]
  terminology: [Schedule, Frequency, Cron, Expire, Flow Execution Policy, Scheduled Runs]

assertions:
  - id: schedule-creates-instances
    when: run-instance
    given: "a flow with Frequency 'Every X seconds' (every 30) enabled"
    expect: "a new instance is created ~every 30s while enabled"
  - id: stop-preserves-definition
    when: run-instance
    given: "Stop Scheduled Runs on a scheduled flow"
    expect: "schedule.enabled=false but frequency/dates unchanged; Start resumes"

known_bugs:
  - id: sched-flow-dropdown-lists-all
    note: "Start/Stop Scheduled Runs Flow dropdown lists all flows, not only scheduled ones. See start-scheduled-runs / stop-scheduled-runs records + memory flowrunner-bug-sched-flow-list."

training:
  learning_objectives:
    - "Schedule a flow (frequency, start, expire) and set the execution policy."
    - "Separate defining a schedule from starting/stopping instance creation."
  prerequisites: [triggers-group, call-flow]
  common_mistakes:
    - "Confusing the schedule definition (this popup) with Start/Stop Scheduled Runs (instance gating)."
    - "Expecting Stop to delete the schedule (it only pauses it)."
  exercise: >
    Schedule a test flow 'Every X seconds' (every 30), watch instances appear, then use a
    Stop -> Wait -> Start sequence (per the Email Sender demo) to pause and resume them.

provenance:
  confidence: V-real
  evidence: >
    Configure Flow Schedule popup inspected live (MyProjects 'Scheduled Runs' flow). schedule
    schema read from the Email Sender flow version metaInfo.schedule (frequency.repeat.every=30,
    enabled, startDate, endDate, onlyScheduledInitiations, allowApiInitiationsWhenScheduleExpired).
    notes.md ('FLOW SCHEDULING' + 'SCHEDULED RUNS DEMO').
  verified_on: 2026-06-15
