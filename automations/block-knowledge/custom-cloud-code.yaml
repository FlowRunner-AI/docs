id: custom-cloud-code
name: Custom Cloud Code
category: Actions
kind: native

api:
  element_type: ACTION
  meta_type: CUSTOM_CLOUD_CODE
  group_type: null
  config_keys: [arguments, code, storeResult, onFailElemId, logging, skipBlock]

testability:
  class: deterministic
  hermetic: true
  mock_strategy: null   # hermetic unless the code itself calls fetch (possible since 1.0.13)

docs:
  purpose: >
    This block runs a snippet of JavaScript as a step in your flow. You pass values in as
    named arguments, write your logic, and the value you return becomes the block's result.
  mental_model: |
    Each time the flow reaches this block, your code runs once, on the server, as a single step.
    Data flows in through the ((Arguments)) list on the block's configuration panel. Each
    argument is a name plus a value -
    typically an expression that reads a previous step's result. Press ((Open Code Editor)) to
    write the code; inside the Code Editor, each argument name is a ready-to-use top-level
    variable. The values arrive already typed, so an array stays an array you can call
    `.filter()` on. Whatever your code returns
    becomes the block's result, which later blocks read in the Expression Editor under the
    block's result alias - by default, {{Custom Cloud Code Result}}.

    The code runs in its own isolated environment, created fresh on every run - nothing you set
    persists from one run to the next.
  when_to_use: >
    Reach for it when a few lines of code would be cleaner than wiring up several blocks to do the
    same thing. Reshaping an API response,
    computing a value, or combining two blocks' outputs is often a short snippet, where the no-code
    equivalent might be a chain of Transform Data blocks that clutters the flow. It is also how you
    do something genuinely custom that no built-in block offers. The code can even reach the web
    itself with `fetch`, but save that for the occasional call a snippet genuinely needs: a dedicated
    block like HTTP Request shows its call on the canvas, records it in run history, and can retry
    on failure, none of which a fetch buried in code gets you. You will find the block in the
    Actions group of the block palette.
  sections:
    - title: What the code can use
      position: after_example
      body: |
        The runtime is the isolated JavaScript environment described above. Modern language
        features are all there, and a set of familiar globals comes with them:

        - `fetch` - real network access. It works as it does in a browser: pass headers as a
          plain object and the body as a string, and read the response with `.json()` or
          `.text()`. There are no `Headers`, `FormData`, or `Blob` constructors, so stick to
          plain objects and strings.
        - `crypto` - `randomUUID()`, `getRandomValues()`, and the WebCrypto `subtle` API.
        - `Buffer` - base64 and hex conversions, and binary data generally.
        - Timers - `setTimeout` and `setInterval` really wait. To pause your code, wrap one in a
          Promise and await it: `await new Promise(r => setTimeout(r, 300))`.
        - Text and URLs - `TextEncoder` and `TextDecoder`, `atob` and `btoa`, `structuredClone`,
          `URL` and `URLSearchParams`, and `AbortController`.

        These globals are everything the runtime provides - anything they do not cover still
        comes into the flow through blocks. What is deliberately not here is Node.js itself; the
        exact list is under Limitations below.

        <!-- verified in-product 2026-08-14 (Documentation Flows "Runtime Probe", post release 1.0.13 / FR-3102): present = fetch, Buffer, crypto (randomUUID/getRandomValues/subtle - SHA-256 digest verified), setTimeout/setInterval/clearTimeout (real 300ms delay), queueMicrotask, TextEncoder/TextDecoder, atob/btoa, structuredClone, URL/URLSearchParams, AbortController/AbortSignal. fetch verified live: GET api.github.com 200 + JSON; POST postman-echo with plain-object headers + string body echoed both. Absent = require, process, dynamic import ("A dynamic import callback was not specified"), Blob, File, FormData, Headers, Request, Response, ReadableStream/WritableStream/TransformStream/CompressionStream, WebSocket, EventTarget, MessageChannel, BroadcastChannel, performance/Performance, Crypto/SubtleCrypto constructors. -->
        <!-- doclint: no-shot: a runtime capability list; the Code Editor itself is shown in the example above -->
    - title: As an AI Agent tool
      position: after_example
      body: |
        Custom Cloud Code can also be given to an AI Agent as a tool, so the agent runs a snippet
        on its own when it decides it needs to - to do a calculation or reshape some data mid-task.
        You attach it from the agent's ((Manage Capabilities)) window, where it is listed under
        ((Utils)). The tool then appears in the ((Tools)) row on the agent block, and selecting it
        there opens the tool's own configuration.

        A tool turns the block's usual data flow around: instead of the flow handing every value
        in, the agent supplies what you leave open. Leave the code or an argument value empty and
        the agent provides it at runtime; a filled value is locked - the agent cannot see or
        override it.

        In the tool's Code Editor, each argument gains two extra fields under
        ((Prepare for AI Agent)):

        - ((Value Type)) - the data type the agent must supply, such as a string or a number.
        - ((Description)) - what the argument is for, written for the agent. Together with the
          type, this is how the agent knows what to pass, and when to reach for the tool.

        As an ordinary block step, none of this appears: an argument is just a name and a value.

        <!-- attach flow re-verified in-product 2026-08-14 (Documentation Flows, post 1.0.13 / FR-3227): Manage Capabilities -> Utils lists exactly Assign Instance Name / Custom Cloud Code ("Runs a JavaScript snippet with typed arguments. Anything left empty is filled in by the agent.") / File Reader / HTTP Request, each with a + to add. Added tool shows in the agent node's "Tools" row; clicking it opens a config panel headed "Custom Cloud Code / AI Tool" with Name, OPEN CODE EDITOR, Notes, and the helper text verbatim: "Leave the code or an argument value empty to let the agent provide it at runtime. Filled values are locked - the agent cannot see or override them." The old "tools drawer" phrasing was replaced with these verified surfaces. -->

      image: ../images/reference/custom-cloud-code-agent-tool.png
      alt: >
        The Code Editor's Arguments panel for a Custom Cloud Code tool: an argument's name and
        value fields above a Prepare for AI Agent section with a Value Type dropdown and a
        Description field that tell the agent what to pass.
  example:
    - text: >
        Suppose an upstream Fetch Orders block (an HTTP Request) fetched a list of orders, and the
        rest of the flow needs one question answered: how many orders are still open, and which
        ones - a count to branch on, and the ids to save for the follow-up. Say the fetched list
        looks like this:
    - lang: json
      code: |
        [
          { "id": 1002, "status": "open" },
          { "id": 1003, "status": "shipped" },
          { "id": 1005, "status": "open" }
        ]
    - text: >
        This block - named Count Open Orders here - answers that question. In its ((Arguments))
        list, add one argument named `orders`, and for its value pick the Fetch Orders block's
        result in the Expression Editor. Then write the code in the Code Editor, opened with
        ((Open Code Editor)):
    - lang: javascript
      code: |
        // "orders" is the array returned by the HTTP Request block
        const open = orders.filter(order => order.status === "open");
        return {
          openCount: open.length,
          openIds: open.map(order => order.id),
        };
    - text: >
        The screenshot below shows the editor with `orders` bound beside this code:
    - image: ../images/reference/custom-cloud-code-example.png
      alt: >
        The Code Editor: an argument named orders bound to the HTTP Request
        result, alongside the code that uses it.
    - text: >
        Against the sample list above, the code returns this - the block's result:
    - lang: json
      code: |
        {
          "openCount": 2,
          "openIds": [1002, 1005]
        }
    - text: >
        Downstream blocks read the result through its alias - left at its default,
        Custom Cloud Code Result. In this flow, an Any Open? block
        (a Condition) checks whether {{Custom Cloud Code Result->openCount}} is greater than 0,
        and its Yes branch leads to Save Open Order Ids (a Set Variables block), which stores
        {{Custom Cloud Code Result->openIds}} in an Open Order Ids variable - ready for whatever
        notification or reporting step the flow adds next. The count and ids the code computed drive the rest of
        the flow. On the canvas, the chain reads left to right:
    - image: ../images/reference/custom-cloud-code-canvas.png
      alt: >
        The wired chain on the canvas: a Fetch Orders HTTP Request block into the selected Count
        Open Orders Custom Cloud Code block, into an Any Open? Condition whose Yes branch leads
        to a Save Open Order Ids block. Beside the canvas, the selected block's configuration
        panel shows its Name, the Open Code Editor button, the orders argument bound to the HTTP
        Request Result, and the result alias.
    # custom-cloud-code-canvas.png built + verified in-product 2026-08-14 (Documentation Flows
    # "Runtime Probe" flow, Ready, no error badges): Fetch Orders (HTTP GET jsonplaceholder
    # /todos?_limit=3) -> Count Open Orders (the example code; argument orders bound via the
    # Expression Editor to HTTP Request Result) -> Any Open? (Custom Cloud Code Result->openCount,
    # INT, GREATER THAN, 0) -Yes-> Save Open Order Ids (Set Variables, Open Order Ids =
    # Custom Cloud Code Result->openIds). Both upstream blocks Run-Block-tested
    # (result {openCount:0, openIds:[]} against the placeholder API).
  config:
    - field: Arguments
      description: >
        The values your code can use. Each argument has a name and a value, where the value is
        either static or an expression that references a previous block's result. Inside the
        code, each argument is available as a top-level variable of the same name.
    - field: Code
      description: >
        The JavaScript to run. Press ((Open Code Editor)) to write it in the full-screen Code
        Editor, where the ((Arguments)) panel sits beside the editor. Return the value that
        becomes this block's result.
  common: [name, result_alias, assign_variable, skip_block, logging, notes]
  produces_result: true
  data_in: ((Arguments)) (native JS values; no stringification).
  data_out: The returned value, JSON-serialized.
  limitations:
    - "You cannot load external libraries or packages - the globals listed under What the code can use are everything available. There is no require, no import, no process, and none of the Node modules (fs, http, zlib, and the rest)."
    - "The server runs in UTC with the en-US locale. Date and number formatting for other locales still works - Intl carries the full locale data."
    - "The result is serialized as JSON. Map, Set, and RegExp become empty objects; NaN and Infinity become null; and undefined, functions, and Symbols are dropped."
    - "Code runs in non-strict (sloppy) mode - assigning to an undeclared variable does not throw, so a typo in a variable name can fail silently."
    - "Time is not the tight limit - runs that compute or wait for over a minute complete fine. Memory is: around 100MB of your own allocations is safe, but a couple of hundred megabytes crashes the execution environment, and the block fails with \"Cloud Code execution was interrupted\"."
    - "A value that cannot be JSON-serialized - a BigInt, or an object with a circular reference - fails the block with \"Return value is not JSON-serializable\", naming what could not be converted."
    - "An un-awaited promise rejection crashes the execution environment and fails the block the same way. Await every promise, or attach a .catch()."
  cross_refs: [ai-agent, http-request, handle-error]
  terminology: [Custom Cloud Code, Cloud Code, Arguments]

behavior:
  - note: async/await and Promises are supported; a returned Promise is awaited and unwrapped automatically before the result is captured.
    lang: javascript
    example: "return Promise.resolve({ count: 3 });   // result is { count: 3 }"
  - note: fetch makes real calls; await it and read the reply from the Response.
    lang: javascript
    example: "const reply = await fetch(url, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify(payload) });\nreturn await reply.json();"
  - note: Throwing an Error sets the block's status to Error; the message keeps the error's name as a prefix.
    lang: javascript
    example: 'throw new Error("orders is empty");   // the block fails with "Error: orders is empty"'
  - note: A thrown bare string also fails the block, with that string as the message - though a real Error object remains better style.
    lang: javascript
    example: 'throw "nope";   // the block fails with "nope"'
  - note: Even null passes through as-is; nothing is converted to text on the way in.
    lang: javascript
    example: "return Array.isArray(orders);   // true when orders came from an array-returning block"
  - note: Any JSON-serializable return value works, scalars included.
    lang: javascript
    example: "return 42;   // the block's result is 42"

assertions:
  - id: env-globals
    when: run-block
    code: "return { hasProcess: typeof process, hasFetch: typeof fetch, hasRequire: typeof require, hasBuffer: typeof Buffer, hasCrypto: typeof crypto }"
    expect: { status: Success, result: { hasProcess: undefined, hasFetch: function, hasRequire: undefined, hasBuffer: function, hasCrypto: object } }
  - id: fetch-live
    when: run-block
    code: "const r = await fetch('https://api.github.com/users/octocat'); const j = await r.json(); return { status: r.status, login: j.login }"
    expect: { status: Success, result: { status: 200, login: octocat } }
  - id: timezone-utc
    when: run-block
    code: "return { tz: Intl.DateTimeFormat().resolvedOptions().timeZone }"
    expect: { status: Success, result: { tz: UTC } }
  - id: return-array-ok
    when: run-block
    code: "return [1, 'two', { three: 3 }]"
    expect: { status: Success, result_is_array: true }
  - id: return-scalar-ok
    when: run-block
    code: "return 42"
    expect: { status: Success, result: 42 }
  - id: promise-unwrapped
    when: run-block
    code: "return Promise.resolve({ n: 7 })"
    expect: { status: Success, result: { n: 7 } }
  - id: arg-native-types
    when: run-block
    note: "bind arg `payload` to an array-of-objects upstream result"
    code: "return { isArr: Array.isArray(payload), idType: typeof payload[0].id }"
    expect: { status: Success, result: { isArr: true, idType: number } }
  - id: long-run-ok
    when: run-block
    code: "const s=Date.now(); while(Date.now()-s<12000){}; return { spun: Date.now()-s }"
    expect: { status: Success }
    note: "The former 10s cap is gone; 65s async waits also complete."
  - id: memory-cap
    when: run-block
    code: "const c=[]; for (let i=0;i<200;i++) c.push(new Uint8Array(1024*1024).fill(1)); return { mb: c.length }"
    expect: { status: Error, message_contains: "Cloud Code execution was interrupted" }
    note: "100 x 1MB succeeds; 200 x 1MB crashes the pod (K8S_POD_EXECUTION_ERROR)."
  - id: bigint-errors
    when: run-block
    code: "return { big: 123n }"
    expect: { status: Error, message_contains: "Return value is not JSON-serializable" }
  - id: floating-rejection-crashes
    when: run-block
    code: "Promise.reject(new Error('float')); await new Promise(r=>setTimeout(r,500)); return { ok: true }"
    expect: { status: Error, message_contains: "Cloud Code execution was interrupted" }

known_bugs: []
# Both pre-1.0.13 bugs are fixed (verified 2026-08-14): bare scalar returns now succeed
# ("return 42" -> 42), and non-serializable returns now FAIL the block with
# "Return value is not JSON-serializable: ..." instead of a silent false Success.

training:
  learning_objectives:
    - "Explain what the sandboxed runtime provides (fetch, Buffer, crypto, timers) and why dedicated blocks are still the default for I/O."
    - "Pass data in via Arguments and return a JSON-serializable result."
    - "Handle failure with try/catch and a Handle Error block."
  prerequisites: [arguments-concept, expression-editor, instances-concept]
  common_mistakes:
    - "Calling require() or import — only the documented globals exist; there is no module loading."
    - "Returning a non-JSON value (Map becomes {}, BigInt/circular fails the block)."
    - "Leaving a promise un-awaited — a floating rejection crashes the run's environment."
    - "Expecting module-level variables to persist between runs (they don't)."
  exercise: >
    Given an HTTP Request that returns a JSON array, add a Cloud Code block that receives
    it as an argument and returns { count, firstId }. Then make it throw on empty input
    and catch it with a Handle Error block.

provenance:
  confidence: V-run
  evidence: >
    RE-VERIFIED 2026-08-14 (Documentation Flows "Runtime Probe" flow, post release 1.0.13 /
    FR-3102 - the runtime moved to a pod-based environment with Node-style globals): full
    global sweep (present/absent lists in the "What the code can use" comment); fetch live
    GET+POST; crypto.subtle SHA-256; Buffer base64/hex; timers real; 12s busy-wait and 65s
    async wait complete (old 10s cap GONE); 100MB alloc OK / 200MB+400MB crash pod
    (K8S_POD_EXECUTION_ERROR); return 42 -> 42 (old bug fixed); BigInt + circular ->
    "Return value is not JSON-serializable" block Error (old false-Success bug fixed);
    throw Error -> "Error: <msg>"; throw 'nope' -> message kept (old message-lost behavior
    fixed); floating rejection -> crashes pod, block fails (REVERSED from old "ignored");
    Map/Set/RegExp -> {}, NaN/Infinity -> null; fresh env per run (globalThis counter stays
    1); sloppy mode; UTC / en-US / full ICU. Original baseline: MyProjects 'This is my new
    flow' v3, ~40 Run-Block experiments, 2026-06-13.
  verified_on: 2026-08-14
