id: synchronize
name: Synchronize
category: Utils
kind: native

api:
  element_type: SYNCHRONIZE
  config_keys: [maxWaitingTime, storeResult, onFailElemId, logging]

testability:
  class: deterministic
  hermetic: true
  mock_strategy: "Use fast deterministic parallel branches (Cloud Code/Wait) feeding the Synchronize."

docs:
  purpose: >
    This block waits for several parallel branches of your flow to finish, then continues
    down a single path once they have all arrived.
  mental_model: >
    Think of it as a meeting point. When a flow splits into branches that run side by side,
    each branch runs at its own pace and finishes whenever its work is done. You wire every
    one of those branches into this block, and it holds the flow there until the last branch
    shows up. Only then does it release the single path that leads onward, so anything
    downstream can count on all of that parallel work being complete. You also set a Max
    Waiting Time, a cap on how long it will hold for the stragglers; if that time runs out
    first, it stops waiting and continues anyway.
  when_to_use: >
    Reach for it whenever you fan out into branches that run at the same time and a later step
    needs all of their results together. A common shape is calling two or three sub-flows in
    parallel - so their work overlaps instead of running one after another - and then needing
    every one of them done before you move on. Without this block, the path that finishes first
    would race ahead on its own; with it, the flow waits for the whole group as a unit. The
    trade-off is the wait itself: the flow moves at the speed of the slowest branch, and the Max
    Waiting Time is your safeguard against a branch that hangs.
  example:
    - text: >
        Suppose a flow registers a new customer account, and three pieces of setup can happen at
        the same time because none of them depends on the others. You fan the flow out into three
        parallel branches, each a Call Flow block that runs a sub-flow: one creates the funding
        method, one creates ancillary products, and one records the entity involvement. They start
        together and each finishes when its own work is done.
    - text: >
        The next step builds a welcome summary that needs all three results, so it must not run
        until every branch is finished. Wire all three Call Flow branches into a Synchronize block,
        and set its Max Waiting Time to 60 seconds - long enough for the slowest sub-flow on a
        normal run, short enough that a stuck branch will not hold the flow forever:
    - lang: text
      code: |
        Branch A: Call "Create Funding Method" Flow      finishes at ~8s
        Branch B: Call "Create Ancillary Products" Flow  finishes at ~22s
        Branch C: Call "Create Entity Involvement" Flow  finishes at ~14s
    - text: >
        The Synchronize block holds the flow until the last branch arrives. Branch A finishes first
        at about 8 seconds and waits; Branch C arrives at about 14 seconds and also waits; Branch B
        is the slowest at about 22 seconds. The moment Branch B lands, all three have arrived, the
        60-second cap was never reached, and the flow releases onto its single downstream path to
        build the welcome summary - now safe to read all three results.
    - text: >
        Had Branch B instead hung past 60 seconds, the Max Waiting Time would have fired: the flow
        would have continued at the 60-second mark without that branch, and its result would not be
        available downstream. That is the behavior the cap is there to give you - a guarantee the
        flow eventually moves on rather than waiting forever.
    - image: ../images/reference/synchronize-config.png
      alt: >
        The Synchronize block with its configuration panel: a Max Waiting Time (Days, Hours, Minutes, Seconds) the block waits for parallel branches to arrive before it continues.
  common: [name, logging, notes]
  config:
    - field: Max Waiting Time
      type: simple (Days/Hours/Minutes/Seconds) or expression (seconds)
      description: >
        How long to wait for all branches to arrive before giving up and continuing anyway. With
        Expression Mode off you fill in plain Days, Hours, Minutes, and Seconds fields; with it on
        you supply an expression that works out to a number of seconds, so the cap can be computed
        at run time.
  produces_result: true
  data_in: The arrival of each incoming parallel branch.
  data_out: Releases the single downstream path once all branches arrive, or once the cap fires.
  gotchas:
    - "This block only does something when more than one branch feeds into it. If a single path reaches it, there is nothing to wait for and the flow passes straight through."
    - "If the Max Waiting Time runs out before every branch arrives, the flow continues without the missing branches, and any result they would have produced is not available to later steps. Set the cap high enough to cover the slowest branch on a normal run."
  cross_refs: [actions-group, call-flow, wait]
  terminology: [Synchronize, Max Waiting Time]

assertions:
  - id: waits-for-all
    when: run-instance
    given: "two parallel branches, both finishing under maxWaitingTime"
    expect: "successor runs once, after both branches complete"
  - id: timeout-proceeds
    when: run-instance
    given: "one branch exceeds maxWaitingTime"
    expect: "successor runs at timeout; slow branch dropped"

known_bugs: []

training:
  learning_objectives:
    - "Fan out into parallel branches and converge with Synchronize."
    - "Reason about the Max Waiting Time timeout behavior."
  prerequisites: [call-flow, actions-group]
  common_mistakes:
    - "Setting Max Waiting Time too low (drops slow branches)."
    - "Using it without actual parallel predecessors."
  exercise: >
    Call two sub-flows in parallel, Synchronize them with a 60s max wait, then continue
    to a block that uses both results.

provenance:
  confidence: V-real
  evidence: "FBB 'Create IRA' (LIVE) — Synchronize merges Call 'Create Funding Method' Flow || Call 'Create Ancillary Products' Flow -> Call 'Create Entity Involvement' Flow; maxWaitingTime 61s. notes.md."
  verified_on: 2026-06-14
