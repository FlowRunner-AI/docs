id: ai-agent
name: AI Agent
category: AI
kind: native

api:
  element_type: ACTION
  meta_type: AI_AGENT
  config_keys: [aiProvider, aiModel, aiApiKey, systemPrompt, userPrompt, tools, messagesHistoryEnabled, messagesHistoryLimit, forceParsedOutput, langSmithSettings, storeResult, onFailElemId, logging]

testability:
  class: external          # real LLM call; non-deterministic
  hermetic: false
  mock_strategy: "Stub via Skip Block + Simulated Result; or assert structure, not exact text."

docs:
  purpose: >
    This block puts an AI agent to work inside your flow. You hand it a goal in plain language and a
    set of tools - any of FlowRunner's built-in actions, your own flows, the tools on an MCP server,
    or a Knowledge Base to search - and the agent decides for itself which tools to use to reach the
    goal, then returns its answer. It can also carry memory across runs and hand back structured data
    the blocks after it can read.
  mental_model: >
    You give the agent three things: a ((System Prompt)) that sets its role and rules, a ((User Prompt)) that
    carries the request for this run, and - through ((Manage Capabilities)) - the tools it is allowed to
    use. From there it works toward the goal on its own. It reads the request, and whenever finishing
    the job needs a fact or an action it does not already have, it reaches for one of its tools:
    looking something up with a built-in action, running one of your flows, calling out to an MCP
    server, or searching a Knowledge Base. It folds whatever comes back into its work and keeps going
    until it can answer. You do not wire those steps up yourself - you supply the goal and the tools,
    and the agent chooses which to use and when. Its reply always comes back under an `output`
    property on the result - plain text there, or a structured object when you turn on ((Force Parsed
    Output)) - so a later block reads the answer from `output`, not from the result itself. The ((User Prompt)) is usually
    built in the Expression Editor from earlier blocks' results, so a fresh input flows in on every run.
  when_to_use: >
    Reach for it when a step calls for judgment or open-ended work rather than a fixed rule - reading
    messy input and deciding what it means, gathering the right facts from several places, drafting a
    reply, or handling a small task from start to finish. Attach tools and it stops being something
    that only answers and becomes one that can act: look a customer up, search your own documents, and
    kick off a follow-up flow, all in a single step. Its wording varies from run to run, so use it
    where that is welcome - and turn on ((Force Parsed Output)) when a later block needs the result in a
    fixed shape.
  sections:
    - title: What the agent can do (Manage Capabilities)
      body: |
        ((Manage Capabilities)) is where an answer-only model turns into an agent. Open it and you choose the tools this agent is allowed to reach for, drawn from six groups:

        - **Extensions** - FlowRunner's built-in actions, well over a thousand of them, grouped by the extension they come from: send an email, create or find a record, call an HTTP endpoint, post a message, and far more. These are the same actions you would otherwise drop on the canvas as blocks; here the agent can run any you attach, on its own, whenever the task calls for it.
        - **MCP Extensions** - tools published by the MCP servers you have registered, grouped by server. Attach a whole server, or expand it and pick individual tools.
        - **Flows** - your own flows, handed to the agent as tools it can run. A flow you already built becomes a skill the agent can call mid-task; the flow's description and the description of each of its arguments are what tell the agent when to call it and what to pass. Because the agent runs the whole flow and waits for its result, a flow tool can even pause the agent until a person responds. See [Flows as agent tools](flows-as-agent-tools-concept.md).
        - **Knowledge** - your Knowledge Bases, exposed as document tools (add, list, and delete documents), so the agent can search your own content and ground its answer in it instead of guessing.
        - **Shared Memory** - the flow's own key/value store, so the agent can stash a value mid-task and read it back later, or share state with the rest of the flow. (This is the same store that backs the agent's [Messages History](flow-memory-concept.md).)
        - **Utils** - a small set of utility tools: naming the current instance, making an HTTP request directly, reading a file from a URL, and running a [Custom Cloud Code](custom-cloud-code.md) snippet the agent can feed its own inputs to.

        <!-- Utils re-verified in-product 2026-08-14 (Documentation Flows, Manage AI Agent Capabilities -> Utils), post release 1.0.13 / FR-3227: exactly four tools - Assign Instance Name ("Assign a custom name to the current flow instance for identification."), Custom Cloud Code ("Runs a JavaScript snippet with typed arguments. Anything left empty is filled in by the agent."), File Reader ("Read a file from a URL. Supported file types depend on the selected AI provider and model."), HTTP Request ("Send an HTTP request to any URL with configurable method, headers, body, and query parameters."). NOTE this workspace showed FIVE categories (Extensions 3195 / Flows 33 / Knowledge 4 / Shared Memory 3 / Utils 4) - MCP Extensions appears only when MCP servers are registered, and counts have drifted from the 2026-06-24 capture (see parked follow-up: recapture ai-agent-capabilities.png + reconcile counts/groups). -->


        You decide what this particular agent gets; it then decides, run by run, which of those tools it actually needs. Leave a tool's input blank and the agent fills it in itself - handy, but the value is its own guess, so pin any input that has to be exact.
      image: ../images/reference/ai-agent-capabilities.png
      alt: >
        The Manage AI Agent Capabilities window. Down the left, six tool groups with counts - Extensions
        (1449), MCP Extensions (50), Flows (18), Knowledge (4), Shared Memory (3), and Utils (2) - above a
        search box. The Knowledge group is selected, listing its document tools on the right: Add Document,
        Delete by Filter, Delete Document, and List Documents, each with a plus to attach it.
  example:
    - text: >
        Say a support flow receives a customer's question and you want an agent to answer it. A good
        answer needs facts the model does not have on its own: the customer's recent orders, and what
        your help articles say. This is exactly where capabilities earn their keep.
    - text: >
        Set the ((System Prompt)) to the job the agent should do on every question:
    - lang: text
      code: |
        You are a support assistant. Use your tools to look up the customer and their
        recent orders, and to search the help articles, then answer the question in two
        or three sentences. If you are not sure, say so rather than guess.
    - text: >
        In the ((User Prompt)), feed in the incoming question. Build it in the Expression Editor so the
        live question flows in on every run rather than being pasted in as fixed text:
    - lang: text
      code: |
        {{Initial Data->question}}
    - image: ../images/reference/ai-agent-config.png
      alt: >
        The AI Agent block's configuration panel: AI Model set to Claude Sonnet 4.6, an API key filled
        in, a System Prompt telling the agent to use its tools to look up the customer and search the
        help articles, and the User Prompt shown as a bound reference pill reading "Initial Data
        question". The MANAGE CAPABILITIES button at the top of the panel is where its tools are attached next.
    - text: >
        Now open ((Manage Capabilities)) and attach two tools: a built-in action that fetches a customer's
        recent orders, and your Help Articles Knowledge Base. That is the whole of the wiring - you are
        handing the agent the tools, not scripting when to use them.
    - text: >
        When the flow runs, the agent reads the question, decides on its own that it needs the order
        history and a help article, calls the lookup action and searches the Knowledge Base, and writes
        an answer grounded in both - none of which you wired step by step. Turn on ((Force Parsed Output))
        and name the fields you want in the ((System Prompt)), and the structured answer comes back inside
        the result's `output` property, ready for a later block to act on:
    - lang: json
      code: |
        {
          "output": {
            "answer": "Your most recent order, #10473, shipped Tuesday and is due to arrive Friday. If it has not arrived by then, reply here and we will open a trace.",
            "needsHuman": false
          }
        }
    - text: >
        Because the reply always arrives under `output`, a later block reads `output->needsHuman` to
        decide whether to send the answer straight to the customer or route the ticket to a person, and
        shows `output->answer` either way.
  common: [name, result_alias, assign_variable, skip_block, logging, notes]
  config:
    - field: AI Model
      type: dropdown
      description: >
        Required. The model to call, chosen from one list grouped by provider (Claude, GPT, Gemini, and
        others); the provider is implied by the model you pick.
    - field: AI API Key
      type: key picker
      description: >
        Required. The key that authorizes the call. Pick a key you have already saved, or type a new
        one right here. Without a valid key the call cannot run.
    - field: System Prompt
      type: expression
      description: >
        The standing instruction that sets the agent's role, behavior, and rules, applied to every
        request this block makes.
    - field: User Prompt
      type: expression
      description: >
        The request for this run. Usually built in the Expression Editor from earlier blocks' results,
        so the input changes from run to run.
    - field: Manage Capabilities
      type: button (opens the Manage AI Agent Capabilities window)
      description: >
        Opens the window where you attach the agent's tools - built-in actions, MCP server tools, your
        own flows, and Knowledge Bases. See "What the agent can do" above.
    - field: Files
      type: repeatable (URL + MIME Type per file)
      description: >
        Files for the model to read alongside the prompts - each entry is a URL and a MIME Type,
        added with the ((+)) control. The files are attached to the first message of the
        conversation; with ((Messages History)) on they are sent only once, at the start of the
        dialogue. What the model can read depends on the provider: Anthropic takes images
        (JPEG, PNG, GIF, WebP) and PDF; Gemini takes images, PDF, audio, video, PPTX and more
        (not DOCX, DOC, or EPUB); OpenAI pro models take images and most document formats,
        OpenAI standard models images only; other providers do not support file reading.
    - field: Messages History
      type: toggle with a message limit
      description: >
        When on, the model is also fed the messages from recent prior runs of this block, up to the
        limit you set (maximum 20), so it can carry context across separate interactions. This is the
        agent's memory across runs (see [Agent Memory](flow-memory-concept.md)), and it is kept in Shared Memory.
    - field: Force Parsed Output
      type: toggle
      description: >
        When on, the block appends an instruction to your System Prompt asking the model for JSON, then
        parses what comes back: first the whole reply as an object or array, and failing that the contents
        of a fenced JSON code block if the model wrapped its answer in one. When either works, `output`
        holds structured data you can read field by field. When neither does, `output` holds the reply as
        plain text, unchanged - see "Things to watch for".
    - field: LangSmith Settings
      type: toggle
      description: >
        Connects this block to LangSmith, an outside service for tracing and monitoring AI calls, so you
        can inspect what was sent and returned.
  produces_result: true
  data_in: System and User prompts, plus any tool results and prior-run messages when those are enabled.
  data_out: >
    The model's reply, always under an `output` property on the result - plain text, or a structured
    object when ((Force Parsed Output)) is on.
  gotchas:
    - "The reply always arrives in the result's output property. Read it as `output` for the text, or `output->yourField` for a named field when ((Force Parsed Output)) is on. Reading the result directly, without going through `output`, gets you nothing."
    - "The output is not deterministic: the same prompts can come back worded differently from one run to the next, so this block suits work where the wording can vary, not a step that needs an identical value every time. Write downstream steps to tolerate that, and when a later block needs the result in a fixed shape, turn on ((Force Parsed Output)) so the model returns structured JSON instead of prose."
    - "((Force Parsed Output)) asks, it does not guarantee. It adds an instruction to your System Prompt and then parses the reply - the whole thing as an object or array first, otherwise the body of a fenced JSON code block if the model wrapped its answer in one. A model that answers in prose anyway leaves `output` holding that prose, and `output->yourField` then reads nothing rather than failing loudly. So name the fields you want in the ((System Prompt)) rather than relying on the toggle alone, and have the next block cope with a field that did not arrive."
    - "When you attach a tool but leave one of its inputs blank, the agent fills that input in itself while it runs. That is convenient, but it means the value is the agent's guess. If an input has to be a specific value, set it explicitly so the agent cannot choose its own."
    - "The block cannot run without a model and a valid API Key. You can pick a saved key or type a new one in the ((AI API Key)) field."
    - "((Messages History)) only carries context when it is turned on, and even then only up to the limit you set (maximum 20). With it off, each run starts with no memory of earlier runs."
    - "While testing, you can avoid a real model call - and its cost - by turning on ((Skip Block)) and putting a sample reply in ((Simulated Result)), so the rest of the flow runs against that stand-in instead."
  cross_refs: [flows-as-agent-tools-concept, flow-memory-concept, knowledge-bases-concept, ai-router]
  terminology: [AI Agent, System Prompt, User Prompt, Tools, Manage Capabilities, Knowledge Base, Messages History, Force Parsed Output]

help_tooltips:   # verbatim from product UI (hover the `?` icons); AI Agent is heavily annotated
  AI Model: "Choose the specific AI model grouped by provider (e.g., GPT-4, Claude, Gemini)"
  AI API Key: "Enter your API key for authentication with the selected AI provider"
  System Prompt: "Define the agent's behavior, role, and instructions that remain consistent across all interactions"
  User Prompt: "The message or query to send to the AI agent, can include dynamic variables from your workflow"
  LangSmith Settings: "Settings for LangSmith - a tracing and monitoring system for AI Agent"
  Messages History: "Enable conversation memory to maintain context across multiple agent interactions"
  Files: "Files are attached to the first message of the conversation. If messages history is enabled, files are sent only once — at the start of the dialogue. Supported file types per AI provider: Anthropic: Images (JPEG, PNG, GIF, WebP), PDF; Gemini: Images, PDF, audio, video, PPTX and more. DOCX/DOC/EPUB not supported; OpenAI pro models: Images and documents of most formats; OpenAI standard models: Images only; Other providers: File reading not supported (captured verbatim 2026-08-06)"
  Force Parsed Output: "Automatically parse the AI response as structured data (JSON) instead of plain text. When enabled, it extends your system prompt with instructions to return structured results"

assertions:
  - id: returns-response
    when: run-block
    given: "system 'reply with the word OK', user 'go'"
    expect: { status: Success, result_contains: "OK" }
    note: "Non-deterministic - prefer structural assertions or stubs."

known_bugs: []

training:
  learning_objectives:
    - "Configure an agent with a model, key, and prompts."
    - "Attach tools/knowledge bases; understand AI-filled vs pinned params."
    - "Choose Force Parsed Output for downstream JSON."
  prerequisites: [api-keys-registry, expression-editor]
  common_mistakes:
    - "Expecting deterministic output."
    - "Not pinning critical tool params."
  exercise: >
    Build an agent that answers a question using one attached tool and one Knowledge Base, and
    returns JSON via Force Parsed Output.

provenance:
  confidence: V-real
  evidence: "MyProjects 'Content Engine' v6 - 33 AI_AGENT actions (Seed Quality Assessor, Classify Content Type, Generate Angles...). Re-verified live 2026-06-24: Manage Capabilities modal has SIX tool groups (Extensions 1449 / MCP Extensions 50 / Flows 18 / Knowledge 4 / Shared Memory 3 / Utils 2), not four; Knowledge group exposes document tools (Add Document, Delete by Filter, Delete Document, List Documents); Extensions are grouped by source extension (Acumatica, AI Image Generator...); Flows lists each LIVE workspace flow as 'Call \"X\" flow'. AI Model is one provider-grouped list (no separate provider field); AI API Key accepts a saved key or a typed value. Result is always returned under an output property, and Flow Memory (Messages History, max 20) is backed by Shared Memory. notes.md + screenshots 09-12, ai-agent-capabilities.png."
  verified_on: 2026-06-24
