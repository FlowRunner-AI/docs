id: knowledge-base-delete-document
name: "Knowledge Base: Delete Document"
category: Actions
kind: native

api:
  element_type: ACTION
  meta_type: KNOWLEDGE_BASE
  subtype: DELETE_DOCUMENT
  config_keys: [knowledgeBaseId, fileId, retryPolicy, saveToVariable, storeResult, onFailElemId, logging]

testability:
  class: external
  hermetic: false
  mock_strategy: "Use a dedicated test KB, or stub via Skip Block + Simulated Result."

docs:
  purpose: >
    This block removes one document from a Knowledge Base. You pick the Knowledge Base and
    give the block the document's id, and that single document is taken out of it.
  mental_model: |
    A Knowledge Base holds a set of documents, and each one carries its own id - a `fileId`
    that the Knowledge Base assigned when the document was added. This block deletes the one
    document whose `fileId` you hand it, leaving every other document in place. It works on
    exactly one document per run, identified by that id and nothing else, so you have to know
    which document you mean before the block runs. The usual way to get a `fileId` is to read
    it from an earlier List Documents block, which returns the documents and their ids.

    You will find this block in the block palette under the Actions category, in the Knowledge
    Base group alongside the other Knowledge Base blocks. It reports the outcome of the delete
    on its result, reachable downstream through its alias `Knowledge Base: Delete Document
    Result` - but that result is mainly a record that the call ran, not data you usually act on.
    When you need to be sure the document is actually gone, the dependable check is to run a
    List Documents block afterward and confirm the `fileId` is no longer in the list.
  when_to_use: >
    Reach for it when you already know the exact document you want gone - most often a `fileId`
    you pulled from a List Documents result, or one you saved when the document was added.
    It is the right choice for surgical, one-at-a-time removal: retiring a single outdated file,
    or cleaning up a document a flow created earlier. If instead you want to remove every
    document that matches some condition - say everything tagged with an old version - reach for
    Knowledge Base: Delete by Filter, which removes a set in one step rather than making you
    delete each id on its own.
  example:
    - text: >
        Suppose a flow keeps a Knowledge Base of product manuals, and you want to drop the manual
        for a discontinued model. Start with a List Documents block pointed at that Knowledge Base,
        filtering on the metadata you tagged the manuals with. It returns a list of files, each one
        a document with its own `fileId`:
    - lang: json
      code: |
        {
          "files": [
            { "fileId": "doc_8f21a", "metadata": { "model": "X100", "type": "manual" } },
            { "fileId": "doc_3b07c", "metadata": { "model": "X200", "type": "manual" } }
          ]
        }
    - text: >
        The discontinued model is the X100, the first entry, so the document you want to remove is
        the one with `fileId` `doc_8f21a`. In the Delete Document block, set the ((Knowledge Base ID))
        to the same Knowledge Base, and for ((File ID)) point at that id from the
        List Documents result - for example its first file, built in the Expression Editor as
        {{Knowledge Base: List Documents Result->files[0].fileId}}.
    - image: ../images/reference/knowledge-base-delete-document-config.png
      alt: >
        The Knowledge Base: Delete Document block selected on the canvas with its configuration
        panel: Knowledge Base ID is Product Manuals, and File ID is the expression
        {{Knowledge Base: List Documents Result->files[0].fileId}} that reads the first file's id
        from an earlier List Documents result.
    - text: >
        When the flow runs, the block removes only that one document. The X100 manual is gone from
        the Knowledge Base, while the X200 manual stays untouched. The block's own result just
        records that the delete ran, so it is not worth reading for confirmation - instead run a
        List Documents block again afterward, and `doc_8f21a` is no longer in the list - proof the
        right document, and only that document, was deleted.
  common: [name, result_alias, assign_variable, logging, notes]
  config:
    - field: Knowledge Base ID
      type: expression
      description: Required. The Knowledge Base to delete the document from, set by its name or an expression.
    - field: File ID
      type: expression (string)
      description: >
        Required. The id of the document to delete. This is the `fileId` the Knowledge Base
        assigned the document, usually supplied as an expression that reads it from an earlier
        List Documents result.
    - field: Retry Policy
      type: configuration
      description: >
        Optional. How the block should retry if the delete request fails, so a brief hiccup does
        not stop the flow.
  produces_result: true
  data_in: The chosen Knowledge Base and the document's fileId.
  data_out: "A record that the delete ran (its alias is {{Knowledge Base: Delete Document Result}}); confirm removal by re-listing rather than reading this result."
  gotchas:
    - "This block deletes by document id, not by name or content. You have to give it the exact fileId the Knowledge Base assigned the document; a title or filename will not match. The reliable way to get that id is from a List Documents block, which returns each document together with its fileId."
    - "Only the one document with the fileId you supply is removed. To remove several documents at once, use Knowledge Base: Delete by Filter instead of repeating this block for each id."
  cross_refs: [knowledge-base-list-documents, knowledge-base-delete-by-filter, knowledge-bases-concept]
  terminology: [Knowledge Base, Document, fileId]

assertions:
  - id: delete-removes-doc
    when: run-instance
    given: "a fileId from List Documents"
    expect: "a subsequent List no longer includes that fileId"

known_bugs: []

training:
  learning_objectives:
    - "Delete a specific KB document by fileId."
    - "Chain List -> Delete Document."
  prerequisites: [knowledge-base-list-documents]
  common_mistakes:
    - "Passing a name instead of the fileId."
  exercise: >
    List a KB, take files[0].fileId, and delete that document; re-list to confirm.

provenance:
  confidence: V-real
  evidence: "Tests 'KB Test' flow v1 — Delete Document (fileId <- List Documents Result.files[0].fileId). notes.md."
  verified_on: 2026-06-15
