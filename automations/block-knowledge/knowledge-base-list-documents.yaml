id: knowledge-base-list-documents
name: "Knowledge Base: List Documents"
category: Actions
kind: native

api:
  element_type: ACTION
  meta_type: KNOWLEDGE_BASE
  subtype: LIST_DOCUMENTS
  config_keys: [knowledgeBaseId, filter, limit, offset, retryPolicy, saveToVariable, storeResult, onFailElemId, logging]

testability:
  class: external
  hermetic: false
  mock_strategy: "Use a dedicated test KB, or stub via Skip Block + Simulated Result."

docs:
  purpose: >
    This block reads back the documents stored in a Knowledge Base. You point it at one of your
    Knowledge Bases and it returns the documents in it, optionally narrowed to the ones whose
    metadata matches values you give.
  mental_model: >
    Think of it as asking a Knowledge Base "which documents do you hold?" and getting a list back.
    The result is a list of documents, where every document carries its own id (its file id) plus
    whatever metadata was saved with it when it was added. If you leave the ((Filter)) empty you get
    every document; if you fill the ((Filter)) in, you get only the documents whose metadata matches.
    Because the list can be long, you read it in pages: ((Limit)) sets how many documents come back at
    once, and ((Offset)) sets how far into the full list that page starts.
  when_to_use: >
    Reach for it - it sits in the Actions palette, in the Knowledge Base group - whenever a flow
    needs to see what is actually in a Knowledge Base rather than only add to it. Two cases come up
    most. First, taking stock - confirming a document was added, or
    counting how many documents match a category. Second, and more common, getting the file id of a
    document so a later step can act on it: the only way to delete a specific document is to hand its
    file id to a Knowledge Base: Delete Document block, and this block is how you obtain that id. If
    you already know the exact document you want and have its id from somewhere else, you do not need
    this block at all.
  example:
    - text: >
        Suppose you keep a Knowledge Base called Support Articles, and each article was added with
        metadata recording the product area it belongs to and whether it is still current. You want
        to clean out the retired billing articles. The first step is to find them, so you add a
        Knowledge Base: List Documents block, pick Support Articles in its ((Knowledge Base ID))
        field, and set the ((Filter)) to match the documents you care about:
    - lang: json
      code: |
        {
          "area": "billing",
          "status": "retired"
        }
    - image: ../images/reference/knowledge-base-list-documents-config.png
      alt: >
        The Knowledge Base: List Documents block selected on the canvas with its configuration panel:
        Knowledge Base ID is Support Articles, and two Filter rows read area = billing and
        status = retired, with Limit and Offset left empty.
    - text: >
        The ((Filter)) matches on every pair you give and only on exact values, so this returns the
        documents whose metadata has both area equal to billing and status equal to retired, and no
        others. The exact, flat-only match is deliberate: the metadata you save with a document is a
        plain set of key-value labels, so the filter compares label against label rather than running
        a search, which is why a partial value or a nested object will not match. The block hands back
        a list of those documents. A trimmed view of the result looks like this:
    - lang: json
      code: |
        {
          "files": [
            { "fileId": "a17c-9f20", "metadata": { "area": "billing", "status": "retired" } },
            { "fileId": "b48e-1c03", "metadata": { "area": "billing", "status": "retired" } }
          ]
        }
    - text: >
        Each entry is one document, and the part you usually want is its fileId. The block exposes
        this result under the alias in its ((Reference Result Data As)) field - by default
        {{Knowledge Base: List Documents Result}} - so a later block reads it through the Expression
        Editor under Block Data. To remove the first match, you feed that document's file id into a
        Knowledge Base: Delete Document block, building the reference
        {{Knowledge Base: List Documents Result->files[0].fileId}} in its file-id field - the
        ``files`` list, index ``0``, the ``fileId`` of that entry. To delete every match rather than
        one, place the Knowledge Base: Delete Document inside a List Iterator pointed at
        {{Knowledge Base: List Documents Result->files}}; each pass exposes one document as
        {{Current Iteration Item}}, and you read its id with {{Current Iteration Item->fileId}},
        deleting the whole retired-billing set in a single walk.
  common: [name, result_alias, assign_variable, logging, notes]
  config:
    - field: Knowledge Base ID
      type: expression
      description: Required. The Knowledge Base to read documents from, set by its name or an expression.
    - field: Filter
      type: repeatable property and value pairs
      description: >
        Optional. Metadata values a document must match to be included. Each row is a property name
        and the value it must equal; give several rows and a document has to match all of them.
        Matching is exact, and only flat values are compared, so nested objects are not supported.
        Leave the Filter empty to return every document.
    - field: Limit
      type: number
      description: >
        How many documents to return at most. Use it with Offset to read a long list one page at a time.
    - field: Offset
      type: number
      description: >
        How far into the full list to start, counting from 0. With Limit, this is how you step through
        the documents a page at a time - for example, Offset 50 with Limit 50 returns the second page.
  produces_result: true
  data_in: The chosen Knowledge Base, plus the optional metadata ((Filter)) and the ((Limit)) and ((Offset)).
  data_out: "A list of documents under files, each with its file id (fileId) and the metadata saved with it."
  gotchas:
    - "The result is a list of documents under files, not a bare array of ids. To act on a single document, read its file id from the entry you want through the result alias - for example {{Knowledge Base: List Documents Result->files[0].fileId}} for the entry at index 0."
    - "An empty ((Filter)) returns every document, bounded only by ((Limit)) and ((Offset)). If you meant to narrow the results, make sure the ((Filter)) is actually filled in."
    - "The ((Filter)) compares exact values and matches every pair you give, so a document is only returned when all of its metadata values match exactly. A near match or a partial value will not be found, and the comparison only looks at flat values - it cannot reach into a nested object."
    - "((Limit)) and ((Offset)) cap how many documents come back in one call. If a Knowledge Base holds more documents than your ((Limit)), raise the ((Limit)) or read further pages with ((Offset)), or you will miss the rest."
  cross_refs: [knowledge-base-add-document, knowledge-base-delete-document, knowledge-bases-concept, list-iterator]
  terminology: [Knowledge Base, Document, fileId, Filter]

assertions:
  - id: list-returns-files
    when: run-instance
    given: "a KB with >=1 document"
    expect: "result.files is a non-empty array; each item has a fileId"
  - id: filter-narrows
    when: run-instance
    given: "filter {tag: t1} where only some docs have tag t1"
    expect: "only matching documents returned"

known_bugs: []

training:
  learning_objectives:
    - "Query KB documents and read fileId for follow-up actions."
    - "Filter by metadata and paginate."
  prerequisites: [knowledge-bases-concept, knowledge-base-add-document]
  common_mistakes:
    - "Assuming a flat list (it's files[]); reference files[i].fileId."
  exercise: >
    List a KB filtered by metadata, then feed files[0].fileId into a Delete Document.

provenance:
  confidence: V-real
  evidence: "Tests 'KB Test' flow v1 — List Documents (knowledgeBaseId 'FlowRunner Extensions Catalog'); Delete Document references its Result.files[0].fileId. notes.md."
  verified_on: 2026-06-15
